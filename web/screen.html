<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duet</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="screen">
  <header><h1>Duet</h1><button id="snd" type="button"></button></header>
  <!-- round and score: pinned to the top, outside #app, so they never move with the question -->
  <div id="top"></div>
  <!-- the stage takes whatever height is left; fit() shrinks #app when it would not fit -->
  <div class="stage">
    <aside id="joinbox">
      <img id="qr" src="/qr.png" alt="Kod QR do dołączenia">
      <p id="url" class="dim"></p>
    </aside>
    <div id="app" class="stack"></div>
  </div>
</main>
<script src="/static/common.js"></script>
<script>
function slot(p, i, sub) {
  return h('div', { className: 'slot ' + (p ? (p.online ? 'on' : 'off') : 'empty'), style: p ? '--c:' + p.color : '' },
    h('i', { className: 'ini', ariaHidden: true }, p ? p.name[0].toUpperCase() : i + 1),
    h('b', {}, p ? p.name : 'Gracz ' + (i + 1)),
    h('small', {}, !p ? 'czeka na telefon' : p.bot ? '🤖 bot' : !p.online ? '📵 brak połączenia' : sub ?? 'w grze'));
}

// whose turn it is in dares, bluffs and drawings: their name, big and in their color
const spot = (label, p) => h('div', { className: 'spot', style: '--c:' + p.color }, h('small', {}, label), h('b', {}, p.name));

// One answer card; in the reveal it lists who picked it.
function choice(s, i) {
  const blef = s.mode === 'blef', lie = blef && s.answers && s.answers[s.subject] === i;
  // in "blef" the bluffer's pick is the lie itself, so it is labelled instead of named
  const who = s.answers ? s.players.filter((p, seat) => s.answers[seat] === i && !(blef && seat === s.subject)) : [];
  // the shape and color the phones show on the same answer (blef has no pad: the statements are read out)
  return h('div', { className: 'choice' + (lie ? ' lie' : who.length === 2 ? ' both' : '') + (who.length || lie ? ' picked' : ''), style: blef ? '' : '--k:' + optColor(s, i) },
    !blef && h('i', { className: 'shape', ariaHidden: true }, SHAPES[i]),
    s.q.options[i],
    h('div', { className: 'who' }, lie && h('span', { style: '--c:var(--pink)' }, 'KŁAMSTWO'),
      who.map(p => h('span', { style: '--c:' + p.color }, p.name))));
}

// The whole drawing so far, repainted from the strokes in each state.
function drawing(s) {
  const canvas = h('canvas', { className: 'pad', width: 1000, height: 1000 });
  paint(pen(canvas), s.strokes || [], s.colors);
  return canvas;
}

// Polish plural: 1 wieczór, 2-4 wieczory (but 12-14 wieczorów), 5+ wieczorów.
const plural = (n, one, few, many) => n === 1 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many;

// Statistics across the evenings: three headline numbers, compatibility over time and three short lists.
function statsPanel(st) {
  const tile = (value, label) => h('div', { className: 'tile' }, h('b', {}, value), h('small', {}, label));
  const lines = (title, items, fmt) => items.length > 0 && h('div', { className: 'statlist' }, h('small', {}, title),
    items.slice(0, 4).map(l => h('p', {}, h('span', {}, l.name), h('b', {}, fmt(l)))));
  // the compatibility of the latest games on a 0-100 scale; the box has the chart's own proportions,
  // so the dots stay round, and the latest game is labelled
  const n = st.series.length, xy = st.series.map((v, i) => [30 + i * 720 / Math.max(1, n - 1), 110 - v * .9]);
  const [lx, ly] = xy[n - 1] || [0, 0];
  const chart = h('div', { className: 'chart' });
  if (n > 1) chart.innerHTML = `<svg viewBox="0 0 780 125" role="img" aria-label="Zgodność w kolejnych grach">
    <polyline points="${xy.join(' ')}"/>${xy.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7"/>`).join('')}
    <text x="${lx + 18}" y="${ly + 10}">${st.series[n - 1]}%</text></svg>`;
  return [
    h('h2', {}, 'Wasze statystyki'),
    h('div', { className: 'tiles' },
      tile(st.evenings, plural(st.evenings, 'wieczór', 'wieczory', 'wieczorów')),
      tile(st.games, plural(st.games, 'rozegrana gra', 'rozegrane gry', 'rozegranych gier')),
      tile(st.compat + '%', 'średnia zgodność')),
    st.series.length > 1 && [chart, h('p', { className: 'dim' }, `Zgodność w ostatnich ${st.series.length} grach`)],
    h('div', { className: 'statlists' },
      lines('Zgodność w trybach', st.modes, l => `${l.value}% · ${l.note}`),
      lines('Zwycięstwa', st.wins, l => l.value),
      lines('Ostatnie gry', st.recent, l => `${l.value}%` + (l.note ? ` · ${l.note}` : ''))),
    h('p', { className: 'dim' }, 'Ukryj na telefonie'),
  ];
}

// The couple's profile: agreement per topic with the trend of the latest month,
// what to talk about after the latest evening, and the badges (the earned ones lit).
function profilePanel(pr) {
  const t = pr.topics, best = t[0], worst = t[t.length - 1];
  const bars = t.length > 0
    ? h('div', { className: 'bars' }, t.map(l => [h('span', {}, l.name), h('i', { style: `--v:${l.value}%` }), h('b', {}, l.value + '%'),
        h('small', { className: (l.note || '').startsWith('▲') ? 'up' : 'down' }, l.note || '')]))
    : h('p', { className: 'dim' }, `Temat pojawi się po 3 pytaniach z niego. Na razie: ${pr.rounds} ${plural(pr.rounds, 'pytanie', 'pytania', 'pytań')}.`);
  return [
    h('h2', {}, 'Profil pary'),
    h('div', { className: 'statlists' },
      h('div', { className: 'statlist wide' }, h('small', {}, 'Zgodność w tematach'), bars,
        t.length > 1 && h('p', { className: 'dim' }, `Najbardziej zgodni: ${best.name} · najwięcej różnic: ${worst.name}`)),
      h('div', { className: 'statlist' },
        pr.talk.length > 0 && [h('small', {}, 'Do pogadania po ostatnim wieczorze'), h('div', { className: 'talk' }, pr.talk.map(q => h('p', {}, q)))],
        pr.changed.length > 0 && [h('small', {}, 'Wasza historia: kto zmienił zdanie'), h('div', { className: 'talk' }, pr.changed.map(c => h('p', {}, c.text, h('small', {}, `${c.who}: ${c.from} → ${c.to} · pierwszy raz ${c.when}`))))],
        h('small', {}, `Odznaki: ${pr.badges.filter(b => b.value).length} z ${pr.badges.length}`),
        h('div', { className: 'medals' }, pr.badges.map(b => h('div', { className: 'medal' + (b.value ? ' on' : '') }, h('b', {}, b.name), h('small', {}, b.note)))))),
    h('p', { className: 'dim' }, 'Ukryj na telefonie'),
  ];
}

// The previous month in a few numbers, shown in the menu at the first game of a new one.
function monthPanel(m) {
  const tile = (value, label) => h('div', { className: 'tile' }, h('b', {}, value), h('small', {}, label));
  return [
    h('h2', {}, `Wasz ${m.name}`),
    h('div', { className: 'tiles' },
      tile(m.evenings, plural(m.evenings, 'wieczór', 'wieczory', 'wieczorów')),
      tile(m.games, plural(m.games, 'gra', 'gry', 'gier')),
      tile(m.compat + '%', 'średnia zgodność')),
    m.best && h('p', {}, `Najbardziej zgodni: ${m.best.name} (${m.best.value}%)`),
    m.change && h('p', {}, `Największa zmiana: ${m.change.name} (${m.change.value > 0 ? '▲' : '▼'} ${Math.abs(m.change.value)})`),
    m.badges.length > 0 && [h('p', { className: 'dim' }, 'Nowe odznaki'), h('div', { className: 'list' }, m.badges.map(b => h('span', {}, b.name)))],
    h('p', { className: 'dim' }, 'Dalej na telefonie'),
  ];
}

// The question itself: who it is about, the text, and the answer cards or the 0-100 scale.
function question(s) {
  const about = subj(s), k = s.q.kind;
  const answers = k === 'scale'
    ? h('div', { className: 'scale' },
        h('div', { className: 'track' }, s.answers && s.players.map((p, i) =>
          h('span', { className: 'mark ' + (i ? 'down' : 'up'), style: `--c:${p.color};left:${100 * s.answers[i] / (s.q.max || 100)}%` }, `${p.name} ${s.answers[i]}`))),
        h('div', { className: 'ends' }, ends(s.q).map(t => h('span', {}, t))))
    : k === 'choice'
    ? h('div', { className: 'choices' + (s.answers ? ' revealed' : '') }, (s.q.options || []).map((_, i) =>
        [i > 0 && s.mode === 'wolisz' && h('span', { className: 'or' }, 'czy'), choice(s, i)]))
    : k === 'draw' ? drawing(s)
    : s.texts && h('div', { className: 'who words' }, s.players.map((p, i) => h('span', { style: '--c:' + p.color }, `${p.name}: ${s.texts[i]}`)));
  return [
    (s.cfg.mode === 'mix' || s.cfg.mode === 'rocznica') && h('p', { className: 'tag' }, modeName(s)),
    about && !ranked(s) && (k === 'pick' || k === 'dare' || k === 'write' || k === 'draw' || s.mode === 'blef'
      ? spot(k === 'pick' ? 'Wybiera' : k === 'dare' ? s.q.options[0] + ' dla' : s.mode === 'blef' ? 'Blefuje' : 'Rysuje', about)
      : h('p', {}, 'Pytanie o: ', h('b', { style: 'color:' + about.color }, about.name),
          (k === 'choice' || k === 'scale') && [' · zgaduje: ', h('b', { style: 'color:' + guesser(s).color }, guesser(s).name)])),
    k === 'write' && h('p', { className: 'dim' }, `${about.name} pisze dwie prawdy i jedno kłamstwo na temat:`),
    k === 'text' && !s.texts && h('p', { className: 'dim' }, 'Wpiszcie pierwsze skojarzenie ze słowem'),
    k === 'yesno' && h('p', { className: 'dim' }, 'Chcielibyście? Ekran pokaże tylko wspólne TAK'),
    k === 'talk' && h('p', { className: 'dim' }, s.q.options[0]),
    k === 'draw'
      ? s.q.text && h('h2', {}, 'Hasło: ' + s.q.text)
      : h('h2', { className: k === 'text' ? 'word' : s.q.text.length > 40 ? 'long' : '' }, s.q.text),
    answers,
  ];
}

// Sound is on from the start; the browser still wants one click or key anywhere before it plays.
const unlock = e => audio && e.target.id !== 'snd' && e.key !== 'm' && audio.resume().then(soundButton, () => {}); // no audio device: stay silent
addEventListener('pointerdown', unlock);
addEventListener('keydown', unlock);
function soundButton() {
  $('snd').textContent = !audio ? '' : audible() ? '🔊' : '🔇';
  $('snd').ariaLabel = $('snd').title = audible() ? 'Wycisz dźwięk (M)' : 'Włącz dźwięk (M)';
}
$('snd').onclick = async () => {
  if (!audio) return;
  if (audio.state !== 'running') { await audio.resume().catch(() => {}); muted = false; } else muted = !muted;
  soundButton();
  play('join');
};
if (audio) audio.onstatechange = soundButton;
soundButton();

// What changed since the previous state decides which sound to play.
let prev = null;
function sounds(s) {
  if (!prev) return;
  const online = x => x.players.filter(p => p.online).length, done = x => (x.answered || []).filter(Boolean).length;
  const newRound = s.round !== prev.round || s.phase !== prev.phase;
  if (s.phase === 'end' && prev.phase !== 'end') play('end');
  else if (s.phase === 'reveal' && prev.phase !== 'reveal') play((ranked(s) ? s.pairs.some(p => p.hit) : verdict(s).hit) ? 'hit' : 'miss', .5); // after the answers pop in
  else if (s.phase === 'question' && newRound) {
    // modes without a reveal: the result of the previous card is known only now
    const scored = (s.found || []).length > (prev.found || []).length || s.points[0] + s.points[1] > prev.points[0] + prev.points[1];
    play(prev.phase === 'question' && scored ? 'hit' : 'next');
  } else if (s.phase === 'question' && done(s) > done(prev)) play('tick');
  else if (s.phase === 'question' && (s.guesses || []).join() !== (prev.guesses || []).join()) play('miss');
  else if (online(s) > online(prev)) play('join');
}
setInterval(() => { // last seconds of a timed round
  const left = endAt - Date.now();
  if (prev && prev.phase === 'question' && prev.mode === 'rysowanie' && left > 0 && left < 5500) play('clock');
}, 1000);

function render(s) {
  sounds(s);
  // a burst of confetti for a match and for the end of a game
  if (prev && s.phase !== prev.phase && (s.phase === 'end' || s.phase === 'reveal' && !ranked(s) && verdict(s).hit)) confetti();
  // entrance animations only when a new screen appears, not on every small update
  const fresh = !prev || s.phase !== prev.phase || s.round !== prev.round || !!s.list !== !!prev.list || !!s.stats !== !!prev.stats || !!s.profile !== !!prev.profile || !!s.month !== !!prev.month || !!s.letters !== !!prev.letters;
  $('app').classList.toggle('fresh', fresh);
  prev = s;
  // ready: at least one couple, and nobody still waiting for a partner or offline
  const both = s.pairs.length > 0 && s.pairs.every(p => p.players.length === 2 && p.players.every(x => x.online));
  // the code stays up in the menu, so another couple can still join; it only shrinks once someone is ready
  // in a game the code comes back when someone drops out, so a phone that lost its seat can take it again
  $('joinbox').hidden = s.phase !== 'lobby' && both || !!s.list || !!s.stats || !!s.profile || !!s.month || !!s.letters;
  $('qr').classList.toggle('small', both);
  document.querySelector('main').classList.toggle('ingame', s.phase !== 'lobby'); // small title: the game gets the room
  $('url').textContent = link || `${location.host}/play?k=${s.key}`; // for a phone that cannot scan the code
  const m = s.mode;
  // the round on the left, the score on the right, out of the way of the question
  const round = () => {
    const info = s.active ? `teraz: ${pairName(activePair(s))}` : m === 'rozmowy' || s.multi ? '' : m === 'tak' ? `wspólne TAK: ${(s.found || []).length}`
      : s.scored ? score(s) : `zgodność ${s.matches}/${s.round - (s.phase === 'question')}`;
    return h('div', { className: 'topbar' }, h('span', { className: 'pill' }, `${cardMode(s) ? 'Karta' : 'Runda'} ${s.round} z ${s.rounds}`), info && h('span', { className: 'pill' }, info));
  };
  $('top').replaceChildren(...(s.phase === 'question' || s.phase === 'reveal' ? [round()] : []));
  let kids;
  if (s.phase === 'lobby') {
    kids = [
      s.stats || s.list || s.profile || s.month || s.letters ? null // these need the whole screen
        : s.multi
        ? h('div', { className: 'pairs' }, s.pairs.map(p => h('div', { className: 'pairbox' }, h('small', {}, 'Para ' + p.n),
            [0, 1].map(i => slot(p.players[i], i)))))
        : h('div', { className: 'slots lobby' }, slot(s.players[0], 0, both && s.scored ? (s.stakeSet[0] ? '✓ stawka wpisana' : 'bez stawki') : undefined),
            h('span', { className: 'heart', ariaHidden: true }, '💞'), slot(s.players[1], 1, both && s.scored ? (s.stakeSet[1] ? '✓ stawka wpisana' : 'bez stawki') : undefined)),
      s.letters
        ? [h('h2', {}, '📬 List sprzed roku'), letterList(s.letters), h('p', { className: 'dim' }, 'Schowaj na telefonie')]
        : s.month
        ? monthPanel(s.month)
        : s.profile
        ? profilePanel(s.profile)
        : s.stats
        ? statsPanel(s.stats)
        : s.list
        ? [h('h2', {}, 'Wasze wspólne TAK'),
           h('div', { className: 'list' }, s.list.map(it => h('span', { className: it.done ? 'done' : '' }, (it.done ? '✓ ' : '') + it.text))),
           h('p', { className: 'dim' }, 'Odhaczanie, usuwanie i ukrycie listy na telefonie')]
        : both
        ? [h('div', { className: 'modecard' },
             h('div', { className: 'icon', ariaHidden: true }, (MODE_INFO[s.cfg.mode] || ['🎮'])[0]),
             h('div', {}, h('h2', {}, optName(s, 'mode')), h('p', { className: 'rule' }, s.rule),
               h('p', { className: 'chips' }, h('span', {}, optName(s, 'tone')), h('span', {}, optName(s, 'length'))))),
           h('p', { className: 'dim' }, 'Ustawcie grę na telefonie i naciśnijcie Start')]
        : s.players.length < 2 && h('p', { className: 'dim' }, 'Zeskanujcie kod telefonami'), // someone who dropped out shows on their card
    ];
  } else if (s.phase === 'question') {
    kids = [
      s.rule && h('p', { className: 'rule' }, s.rule),
      againLine(s),
      question(s),
      m === 'rozmowy'
        ? h('p', { className: 'dim' }, 'Porozmawiajcie · Dalej na telefonie')
        : m === 'rysowanie'
        ? [clock(s), h('p', { className: 'dim' }, s.guesses ? `${guesser(s).name}: ${s.guesses.join(' · ')}` : `${guesser(s).name} zgaduje na telefonie`)]
        : m === 'wyzwania'
        ? h('p', { className: 'dim' }, s.q.kind === 'pick' ? `${subj(s).name} wybiera na telefonie`
            : `${guesser(s).name} ocenia na telefonie: zaliczone czy nie`)
        : [h('p', { className: 'phones' }, '📱 Odpowiadajcie na telefonach'), ranked(s)
          ? h('div', { className: 'list' }, s.pairs.map(p => h('span', { className: p.done ? '' : 'done' }, (p.done ? '✓ ' : '… ') + pairName(p))))
          : h('div', { className: 'slots' }, s.players.map((p, i) => slot(p, i, s.answered[i] ? '✓ gotowe' : 'wybiera…')))],
    ];
  } else if (s.phase === 'reveal' && ranked(s)) {
    kids = [
      h('h2', { className: 'long' }, s.q.text),
      ranking(s, true),
      h('p', { className: 'dim' }, `Dalej na telefonach · gotowi: ${ready(s)}`),
    ];
  } else if (s.phase === 'reveal') {
    const v = verdict(s);
    kids = [
      h('h2', { className: 'verdict ' + (v.hit ? 'hit' : 'miss') }, h('span', { ariaHidden: true }, v.hit ? '💞 ' : '🙈 '), v.text),
      question(s),
      againLine(s),
      h('div', { className: 'slots' }, s.players.map((p, i) => slot(p, i, p.ready ? '✓ dalej' : 'Dalej na telefonie'))),
    ];
  } else {
    kids = summary(s);
  }
  const v = s.phase !== 'lobby' && s.vote;
  if (v) kids.unshift(h('p', { className: 'rule' }, `${v.by} chce ${v.kind === 'skip' ? 'pominąć rundę' : 'zakończyć grę'} · czekamy na: ${v.waiting.join(', ')}`));
  // a new screen is built anew, with its entrance; on the same one only what changed is updated
  if (fresh) $('app').replaceChildren(...kids.flat(3).filter(Boolean)); else morph($('app'), kids);
  fit();
}

// "3 z 4": how many of those here tapped Dalej, when several couples play
function ready(s) {
  const here = s.pairs.flatMap(p => p.players).filter(x => x.online && !x.bot);
  return `${here.filter(x => x.ready).length} z ${here.length}`;
}

// Whatever the projector's resolution, the screen never scrolls and nothing is cut off:
// the content is scaled to fill the stage, shrunk when it is too tall and, in a game, enlarged
// (up to 1.5×) when it would leave the screen half empty, so it reads well from the sofa.
function fit() {
  const app = $('app'), stage = app.parentElement;
  app.style.zoom = 1;
  const most = document.querySelector('main').classList.contains('ingame') ? 1.5 : 1; // the menu shares the room with the QR code
  const z = Math.min(most, stage.clientHeight / app.scrollHeight, stage.clientWidth / app.scrollWidth * most);
  app.style.zoom = z;
  // text re-wraps at the new size: one more pass, in real pixels, takes back whatever overflows
  // (#app must not have a max-height: capped at the stage, it would hide the overflow from this pass)
  const r = app.getBoundingClientRect();
  if (r.height > stage.clientHeight + 1 || r.width > stage.clientWidth + 1) {
    app.style.zoom = z * Math.min(stage.clientHeight / r.height, stage.clientWidth / r.width);
  }
}
addEventListener('resize', fit);
$('qr').onload = fit;
// the title shrinks when a game starts (a .4 s transition): fit again once the stage has its final height
document.querySelector('.screen h1').addEventListener('transitionend', fit);

// Text size for the room: + and - change it, 0 resets; remembered on this device.
let zoom = 1;
try { zoom = +localStorage.getItem('duet-zoom') || 1; } catch {}
function setZoom(z) {
  zoom = Math.min(1.6, Math.max(.7, Math.round(z * 10) / 10));
  document.documentElement.style.setProperty('--zoom', zoom); // scales the projector unit, see style.css
  try { localStorage.setItem('duet-zoom', zoom); } catch {}
  fit();
}
setZoom(zoom);
addEventListener('keydown', e => {
  if (e.key === '+' || e.key === '=') setZoom(zoom + .1);
  else if (e.key === '-') setZoom(zoom - .1);
  else if (e.key === '0') setZoom(1);
  else if (e.key === 'm') $('snd').click();
});

// the same address as in the QR code (PUBLIC_URL, https), not whatever this page was opened with
let link = '';
fetch('/link').then(r => r.ok && r.text()).then(t => { if (t) $('url').textContent = link = t; }).catch(() => {});
// A short 3-2-1 before a result, so everyone knows to look up from the phones.
// States arriving meanwhile are kept, and the newest one is shown when it ends.
let counting = null;
function show(s) {
  if (counting) { counting = s; return; }
  if (s.phase !== 'reveal' || !prev || prev.phase !== 'question' || prev.round !== s.round || s.mode === 'rysowanie') return render(s);
  counting = s;
  let n = 3;
  const tick = () => {
    if (!n) { const latest = counting; counting = null; return render(latest); }
    $('app').replaceChildren(h('div', { className: 'count' }, String(n--)));
    play('tick');
    setTimeout(tick, 700);
  };
  tick();
}
live('/events', show);
</script>
</body>
</html>
