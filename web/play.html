<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0717">
<title>Duet – pilot</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="phone">
  <h1>Duet</h1>

  <!-- static, so typing a name is never wiped by a state update -->
  <form id="join" class="stack" hidden>
    <label>Twoje imię
      <input id="name" maxlength="20" autocomplete="given-name" required>
    </label>
    <div class="colors" id="colors" role="group" aria-label="Twój kolor"></div>
    <fieldset class="picker" id="forms"><legend>Jak się do Ciebie zwracać w pytaniach?</legend></fieldset>
    <fieldset class="picker" id="pairs"><legend>Która para? (Wy dwoje wybieracie ten sam numer)</legend></fieldset>
    <button class="btn">Dołącz</button>
  </form>

  <div id="app"></div>

  <!-- static for the same reason; shown in the menu, placed before Start by CSS order -->
  <label id="stakeBox" hidden>🎁 Tajna stawka: co zrobi dla Ciebie przegrany
    <input id="stake" maxlength="80" placeholder="np. masaż stóp" enterkeyhint="done">
  </label>
  <p id="err" role="alert"></p>
</main>
<script src="/static/common.js"></script>
<script>
// Quiet sounds on the phone (half the projector's volume): a tap unlocks them, muting is remembered here.
try { muted = localStorage.getItem('duet-mute') === '1'; } catch {}
addEventListener('pointerdown', () => audio && audio.state !== 'running' && audio.resume().catch(() => {}));
const beep = name => play(name, 0, .5);

// Opened from the home screen the game has no Safari bars; a one-time hint says how to get there.
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
let hintSeen = standalone;
try { hintSeen ||= localStorage.getItem('duet-a2hs') === '1'; } catch {}


// the neon of the theme: pinks, violets and blues, nothing yellow or lime
const COLORS = ['#ff3d9a', '#ff6f91', '#e85cff', '#9b5cff', '#c4a1ff', '#5b7cff', '#3db8ff', '#2ee6d6'];

// Profile lives on the phone so a rescan (or a dropped connection) puts you straight back in.
let me = {};
try { me = JSON.parse(localStorage.getItem('duet') || '{}'); } catch {}
if (!me.id) {
  // not crypto.randomUUID: it is unavailable on plain http
  me.id = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
}
if (!COLORS.includes(me.color)) me.color = COLORS[Math.floor(Math.random() * COLORS.length)]; // also a color from the old palette

$('name').value = me.name || '';
function drawColors() {
  $('colors').replaceChildren(...COLORS.map(c => h('button', {
    type: 'button', style: '--c:' + c, ariaLabel: 'Kolor ' + c, ariaPressed: c === me.color,
    onclick: () => { me.color = c; drawColors(); },
  })));
}
drawColors();

// "byłeś" or "byłaś": the questions are spelled for the form picked here.
function drawForms() {
  $('forms').replaceChildren($('forms').firstElementChild, ...[['m', 'jak do niego'], ['f', 'jak do niej']].map(([form, label]) => h('button', {
    type: 'button', ariaPressed: me.form === form, onclick: () => { me.form = form; drawForms(); },
  }, label)));
}
drawForms();

// Up to four couples can play at one projector; partners pick the same number.
me.pair ||= 0;
function drawPairs() {
  $('pairs').replaceChildren($('pairs').firstElementChild, ...[0, 1, 2, 3].map(n => h('button', {
    type: 'button', ariaPressed: me.pair === n, onclick: () => { me.pair = n; drawPairs(); },
  }, String(n + 1))));
}
drawPairs();

// The join code comes with the QR link; keep it, so reopening the page without it still works.
me.key = new URLSearchParams(location.search).get('k') || me.key || '';

async function post(path, body) {
  $('err').textContent = '';
  const r = await fetch(path, { method: 'POST', body: JSON.stringify({ id: me.id, ...body }), signal: AbortSignal.timeout?.(5000) /* missing before iOS 16: then no time limit */ }).catch(() => null);
  if (!r || !r.ok) $('err').textContent = r ? await r.text() : 'Brak połączenia z grą';
  return !!r && r.ok;
}
const act = (act, key, value) => post('/api/act', { act, key, value, step: last.step });
async function join() {
  if (!await post('/api/join', { name: me.name, color: me.color, form: me.form || '', key: me.key, pair: me.pair })) return false;
  try { localStorage.setItem('duet', JSON.stringify(me)); } catch {}
  return true;
}

let editing = false;
const rerender = () => { lastKey = ''; show(last); }; // draw the screen again even though the state did not change
$('join').onsubmit = async e => {
  e.preventDefault();
  me.name = $('name').value.trim();
  if (await join()) { editing = false; rerender(); }
};

// The phone has nothing to do: one clear sign to look at the projector instead.
const look = text => h('div', { className: 'look' }, h('div', { className: 'eye', ariaHidden: true }, '👀'), h('b', {}, 'Patrz na projektor'),
  text && h('p', { className: 'dim', id: 'status' }, text));
const btn = (label, onclick, cls = '') => h('button', { className: 'btn ' + cls, type: 'button', onclick }, label);

// One row of options from the menu (mode / tone / length); either phone may change it.
function picker(s, key, title) {
  return h('fieldset', { className: 'picker ' + key }, h('legend', {}, title),
    s.menu[key].map(o => h('button', {
      type: 'button', ariaPressed: s.cfg[key] === o.id, onclick: () => act('config', key, o.id),
      disabled: key === 'mode' && (s.solo || []).includes(o.id), // with several couples: only the modes everyone plays at once
    }, o.name)));
}

// The games as a row of cards to swipe through. The row keeps its scroll position across re-renders,
// and the chosen card slides into view when it changes or the menu comes back after a game.
function modeCards(s) {
  const row = h('div', { className: 'picker mode cards', role: 'group', ariaLabel: 'Gra' },
    s.menu.mode.map(o => h('button', {
      type: 'button', className: 'mode-card', ariaPressed: s.cfg.mode === o.id, onclick: () => act('config', 'mode', o.id),
      disabled: (s.solo || []).includes(o.id),
    }, h('span', { className: 'icon', ariaHidden: true }, (MODE_INFO[o.id] || ['🎮'])[0]), h('b', {}, o.name), h('small', {}, (MODE_INFO[o.id] || ['', ''])[1]))));
  requestAnimationFrame(() => { // the row on the page (a re-render keeps the old one, with its scroll position)
    const on = document.querySelector('.picker.mode');
    if (!on || on.shown === s.cfg.mode) return;
    on.querySelector('[aria-pressed="true"]')?.scrollIntoView({ inline: 'center', block: 'nearest', behavior: on.shown ? 'smooth' : 'instant' });
    on.shown = s.cfg.mode; // a property, not an attribute: morph() leaves it alone
  });
  return row;
}

// how to get the game on the home screen, once
const homeHint = () => !hintSeen && h('div', { className: 'hint' },
  h('p', {}, '📲 Pełny ekran: w Safari Udostępnij, potem „Do ekranu początkowego”'),
  h('button', { type: 'button', ariaLabel: 'Zamknij podpowiedź', onclick: () => { hintSeen = true; try { localStorage.setItem('duet-a2hs', '1'); } catch {} rerender(); } }, '✕'));

// The drawing pad of "rysowanie": one canvas per round, kept across re-renders.
// Points are queued and sent in order, a batch at a time, so strokes arrive as drawn.
let padEl, padKey = '', queue = [], sending = false, ink = [], inkColors = [], penColor = 0; // ink: own strokes, to repaint after an undo
function pad(s) {
  // the round and its word: round 1 of the next game is a new pad, even on a phone that missed the end of the last one
  if (padEl && padKey === s.round + '|' + s.q.text) return padEl;
  padKey = s.round + '|' + s.q.text;
  queue = [];
  ink = [];
  inkColors = [];
  const c = padEl = h('canvas', { className: 'pad', width: 1000, height: 1000 }), ctx = pen(c);
  const at = e => {
    const r = c.getBoundingClientRect(), fit = v => Math.max(0, Math.min(1000, Math.round(v * 1000)));
    return [fit((e.clientX - r.left) / r.width), fit((e.clientY - r.top) / r.height)];
  };
  let last = null;
  c.onpointerdown = e => {
    c.setPointerCapture(e.pointerId);
    last = at(e);
    ctx.strokeStyle = PALETTE[penColor][0];
    line(ctx, ...last, last[0] + .1, last[1]); // a tap leaves a dot
    queue.push({ k: 'new:' + penColor, p: [...last] });
    ink.push([...last]);
    inkColors.push(penColor);
  };
  c.onpointermove = e => {
    const p = at(e);
    if (!last || p[0] === last[0] && p[1] === last[1]) return;
    line(ctx, ...last, ...p);
    last = p;
    ink[ink.length - 1].push(...p);
    const tail = queue[queue.length - 1];
    if (tail && tail.p.length < 200) tail.p.push(...p); else queue.push({ k: '', p });
  };
  c.onpointerup = c.onpointercancel = () => { last = null; flush(); };
  return c;
}
async function flush() {
  if (sending) return;
  sending = true;
  while (queue.length) {
    const b = queue.shift();
    await act('draw', b.k, b.p.join(','));
  }
  sending = false;
}
setInterval(flush, 120);
function clearPad() {
  queue = [];
  ink = [];
  inkColors = [];
  paint(padEl.getContext('2d'), ink);
  act('clear');
}
async function undoPad() {
  await flush(); // the server must have the stroke before it can drop it
  ink.pop();
  inkColors.pop();
  paint(padEl.getContext('2d'), ink, inkColors);
  act('undo');
}

let infoOpen = false; // the folded-away "players and backup" section

const saveStake = () => act('stake', '', $('stake').value);
$('stake').onchange = saveStake;

// ---- the screens of the phone: show() picks one by phase; c = { p, other, menu, home, waiting } ----

// The rare actions hide behind ⋯ in the top corner; a panel slides up with them.
// A tap on any of its buttons (or next to the panel) closes it.
let sheetOpen = false;
const actions = (...bs) => [
  h('button', { className: 'more', type: 'button', ariaLabel: 'Więcej akcji', ariaExpanded: sheetOpen, onclick: () => { sheetOpen = !sheetOpen; rerender(); } }, ico('more')),
  sheetOpen && h('div', { className: 'sheet-bg', onclick: e => { if (e.target === e.currentTarget || e.target.closest('button')) { sheetOpen = false; rerender(); } } },
    h('div', { className: 'sheet', role: 'dialog', ariaLabel: 'Więcej akcji' }, bs.filter(Boolean), h('button', { type: 'button', className: 'cancel' }, 'Anuluj'))),
];
// an icon in front of a label; screen readers read the label only
const iconed = (icon, label) => [h('span', { ariaHidden: true }, icon + ' '), label];
// line icons in the color of the text (emoji would each bring their own colors)
const ICONS = {
  skip: '<path d="M5 5l9 7-9 7z"/><path d="M19 5v14"/>',
  ban: '<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',
  quit: '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/>',
  more: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
};
const ico = name => { const i = h('i', { className: 'ico', ariaHidden: true }); i.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`; return i; };
const withIco = (name, label) => [ico(name), h('span', {}, label)];
const quitBtn = () => h('button', { type: 'button', onclick: () => confirm('Zakończyć grę i wrócić do menu?') && act('quit') }, withIco('quit', 'Zakończ grę'));
const skipBtn = () => h('button', { type: 'button', onclick: () => confirm('Pominąć tę rundę? Nikt nie dostanie punktów.') && act('skip') }, withIco('skip', 'Pomiń rundę'));
// a question you never want again: gone from every later game (the household decides, not guests)
const banBtn = s => s.pair === 1 && h('button', { type: 'button', disabled: !!s.banned,
  onclick: () => confirm('To pytanie już nigdy nie wróci. Na pewno?') && act('ban') }, s.banned ? '✓ Nie wróci' : withIco('ban', 'Nie pokazuj więcej'));
const roundLine = s => h('p', { className: 'dim roundline' }, `${cardMode(s) ? 'Karta' : 'Runda'} ${s.round} z ${s.rounds}`);

function lobbyScreen(s, { p, other, menu, home }) {
  return [
    // the time capsule: a letter written a year ago is waiting
    menu && home && s.lettersDue > 0 && !s.letters && btn(`📬 Otwórzcie ${s.lettersDue > 1 ? 'listy' : 'list'} sprzed roku`, () => act('letters')),
    s.letters && btn('Schowaj listy', () => act('letters'), 'ghost'),
    s.month && btn('Zamknij podsumowanie miesiąca', () => act('month'), 'ghost'),
    homeHint(),
    menu
      ? [modeCards(s),
         picker(s, 'tone', 'Ton'), picker(s, 'length', 'Długość'),
         btn('Start', async () => { await saveStake(); beep('next'); act('start'); }, 'after start')]
      : other
      ? h('p', { className: 'dim' }, `Czekamy, aż ${other.name} wróci…`)
      : [h('p', { className: 'dim' }, 'Czekamy na drugą osobę…'),
         btn('Zagraj z botem (test w pojedynkę)', () => act('bot'), 'ghost')],
    playersBox(s, other, menu),
    // everything not needed every evening, folded away; stays open across re-renders,
    // or any update would fold it away under your finger
    h('details', { className: 'after', open: infoOpen, ontoggle: e => { infoOpen = e.target.open; } }, h('summary', {}, ico('menu'), h('span', {}, 'Więcej opcji'), h('i', { className: 'chev', ariaHidden: true }, '›')),
      menu && home && s.listLen > 0 && btn(s.list ? 'Ukryj naszą listę' : `Pokaż na ekranie naszą listę (${s.listLen})`, () => act('list'), 'ghost'),
      menu && home && s.hasStats && btn(s.stats ? 'Ukryj statystyki' : 'Pokaż statystyki na ekranie', () => act('stats'), 'ghost'),
      menu && home && s.hasProfile && btn(s.profile ? 'Ukryj profil pary' : 'Pokaż profil pary na ekranie', () => act('profile'), 'ghost'),
      // the saved list is managed here while the projector shows it
      s.list && h('div', { className: 'yes' }, s.list.map(it => h('div', { className: 'row' },
        h('span', { className: it.done ? 'done' : '' }, it.text),
        h('button', { type: 'button', ariaLabel: it.done ? 'Oznacz jako niezrobione' : 'Oznacz jako zrobione', ariaPressed: it.done, onclick: () => act('yesdone', '', it.text) }, '✓'),
        h('button', { type: 'button', ariaLabel: 'Usuń z listy', onclick: () => confirm(`Usunąć „${it.text}” z listy?`) && act('yesdel', '', it.text) }, '✕')))),
      btn(muted ? '🔊 Włącz dźwięki na telefonie' : '🔇 Wycisz dźwięki na telefonie', () => {
        muted = !muted;
        try { localStorage.setItem('duet-mute', muted ? '1' : ''); } catch {}
        rerender();
      }, 'ghost'),
      menu && capsule(s),
      home && h('small', {}, 'Kopia zapasowa'),
      home && h('a', { className: 'btn ghost', href: '/api/backup?id=' + me.id, download: '' }, 'Pobierz kopię zapasową'),
      home && h('label', { className: 'btn ghost' }, 'Wczytaj kopię zapasową',
        h('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: async e => {
          const file = e.target.files[0];
          if (!file || !confirm('Wczytanie kopii zastąpi zapisane pytania, listę i statystyki. Kontynuować?')) return;
          $('err').textContent = '';
          const r = await fetch('/api/restore?id=' + me.id, { method: 'POST', body: file }).catch(() => null);
          $('err').textContent = !r ? 'Brak połączenia z grą' : r.ok ? 'Kopia wczytana.' : await r.text();
        } }))),
  ];
}

// Everyone at the table as a card: color, initial, name and state. Your own card edits your name and color,
// the others can be removed (their seat is freed); bots come and go here too.
function playersBox(s, other, menu) {
  return h('section', { className: 'players after' }, h('small', {}, '👥 Gracze'),
    s.pairs.flatMap(x => x.players.map((o, seat) => {
      const mine = x.n === s.pair && seat === s.me;
      return h('div', { className: 'player' + (o.online ? '' : ' off'), style: '--c:' + o.color },
        h('i', { className: 'ini', ariaHidden: true }, o.name[0].toUpperCase()),
        h('span', {}, h('b', {}, mine ? `${o.name} (Ty)` : o.name),
          h('small', {}, [o.bot ? '🤖 bot' : o.online ? 'w grze' : '📵 brak połączenia', s.multi && `para ${x.n}`].filter(Boolean).join(' · '))),
        mine
          ? h('button', { type: 'button', ariaLabel: 'Zmień imię lub kolor', onclick: () => { editing = true; rerender(); } }, '✏️')
          : h('button', { type: 'button', ariaLabel: `Usuń gracza ${o.name}`,
              onclick: () => confirm(`Usunąć gracza ${o.name}? Zwolni się jego miejsce.`) && act('kick', String(x.n), String(seat)) }, '✕'));
    })),
    // trying things out alone: the bot partner can go, and a couple of bots can join for the ranking
    menu && other.bot && h('div', { className: 'row' },
      btn('Usuń bota', () => act('bot'), 'ghost'),
      btn(s.pairs.some(x => x.players.every(o => o.bot)) ? 'Usuń parę botów' : 'Dodaj parę botów', () => act('botpair'), 'ghost')));
}

// What the phone asks you to do, per kind of question; q = c plus { about, mineQ, mine }.
// Choices and scales (and any new kind) fall through to TASK.default.
const TASK = {
  draw: (s, q) => `Co rysuje ${q.about.name}? Patrz na projektor i zgaduj`,
  text: () => 'Pierwsze skojarzenie, jedno słowo',
  yesno: () => 'Tajne: ekran pokaże tylko wspólne TAK',
  dare: () => 'Oceń, gdy skończy',
  write: () => 'Dwie prawdy i jedno kłamstwo o sobie, zaznacz kłamstwo',
  default: (s, q) => s.mode === 'blef' ? (q.mineQ ? 'Zaznaczone zdanie to Twoje kłamstwo' : 'Które zdanie to kłamstwo?')
    : !q.about ? 'Wybierz w tajemnicy' : q.mineQ ? '🙋 Pytanie o Ciebie, odpowiedz szczerze' : `🔮 Zgadujesz, co odpowie ${q.about.name}`,
};

// whose turn it is in dares, bluffs and drawings: their name, big and in their color
const spot = (label, o) => h('div', { className: 'spot', style: '--c:' + o.color }, h('small', {}, label), h('b', {}, o.name));

// The word form of "telepatia" and of guessing a drawing.
const wordForm = (s, q) => q.mine != null
  ? h('div', { className: 'badge' }, s.myText)
  : h('form', { className: 'stack', onsubmit: e => {
      e.preventDefault();
      const word = $('word').value;
      $('word').value = ''; // cleared at once, so the next guess in "rysowanie" can be typed right away
      act('answer', '', word);
    } },
      s.q.kind === 'draw' && clock(s),
      h('input', { id: 'word', maxLength: 30, required: true, autocapitalize: 'off', autocomplete: 'off', enterKeyHint: 'send', ariaLabel: 'Twoje skojarzenie', placeholder: s.q.kind === 'draw' ? 'Co to jest?' : 'Twoje słowo' }),
      h('button', { className: 'btn' }, 'Wyślij'));

// How you answer, per kind of question. Choices (and yes/no) fall through to ANSWER.default.
const ANSWER = {
  talk: s => btn(s.round === s.rounds ? 'Zakończ rozmowę' : 'Dalej', () => act('next')),
  pick: (s, q) => q.mineQ && h('div', { className: 'padgrid n2' }, s.q.options.map((text, i) => h('button', { className: 'btn pick', type: 'button',
    style: '--k:' + ['#9b5cff', '#ff3d9a'][i], onclick: () => act('answer', '', String(i)) }, h('i', { className: 'shape', ariaHidden: true }, ['💬', '🔥'][i]), h('span', {}, text)))),
  dare: (s, q) => !q.mineQ && h('div', { className: 'padgrid n2' }, [['✓', 'Zaliczone', '#3dffa8'], ['✕', 'Nie zaliczone', '#ff3d9a']].map(([shape, label, k], i) =>
    h('button', { className: 'btn pick', type: 'button', style: '--k:' + k, onclick: () => act('answer', '', String(i)) }, h('i', { className: 'shape', ariaHidden: true }, shape), h('span', {}, label)))),
  write: (s, q) => q.mineQ && h('form', { className: 'stack', onsubmit: e => {
    e.preventDefault();
    const f = new FormData(e.target);
    act('answer', f.get('lie'), f.getAll('st').map(t => t.replace(/\s+/g, ' ').trim()).join('\n')); // a typed Enter must not split a statement
  } },
    [0, 1, 2].map(i => h('div', { className: 'stmt' },
      h('textarea', { name: 'st', rows: 2, maxLength: 80, required: true, autocomplete: 'off', placeholder: `Zdanie ${i + 1}`, ariaLabel: `Zdanie ${i + 1}` }),
      h('label', {}, h('input', { type: 'radio', name: 'lie', value: i, required: true }), 'kłamstwo'))),
    h('button', { className: 'btn' }, 'Gotowe')),
  text: wordForm,
  draw: wordForm,
  // the slider stays after answering: until the partner answers you can still move it and send again
  scale: (s, q) => [h('div', { className: 'stack' }, h('div', { className: 'big', id: 'val' }, String(draft)),
    h('input', { type: 'range', min: 0, max: s.q.max || 100, value: draft, ariaLabel: s.q.text,
      oninput: e => { draft = +e.target.value; $('val').textContent = draft; } }),
    h('div', { className: 'ends' }, ends(s.q).map(t => h('span', {}, t)))),
    btn(q.mine != null ? 'Zmień odpowiedź' : 'Zatwierdź', () => { beep('tick'); act('answer', '', String(draft)); }, q.mine != null ? 'ghost' : '')],
  // the pad: the answer's shape and color as on the projector, and its text so a tap is never a guess
  default: (s, q) => {
    const yesno = s.q.kind === 'yesno';
    return h('div', { className: 'padgrid n' + s.q.options.length }, s.q.options.map((text, i) => h('button', {
      className: 'btn pick', type: 'button', ariaPressed: q.mine === i,
      style: '--k:' + (yesno ? ['#3dffa8', '#ff3d9a'][i] : optColor(s, i)),
      onclick: () => { beep('tick'); act('answer', '', String(i)); },
    }, h('i', { className: 'shape', ariaHidden: true }, yesno ? ['✓', '✕'][i] : SHAPES[i]), h('span', {}, text))));
  },
};

// drawing needs the whole phone screen: just the word, the clock and the pad
const drawerScreen = s => [
  h('div', { className: 'row' }, h('h2', {}, s.q.text), clock(s)),
  pad(s),
  h('div', { className: 'swatches' }, PALETTE.map(([color, name], i) => h('button', {
    type: 'button', ariaLabel: 'Kolor: ' + name, ariaPressed: penColor === i, style: '--c:' + color,
    onclick: e => { penColor = i; for (const b of e.currentTarget.parentNode.children) b.ariaPressed = b === e.currentTarget; },
  }))),
  h('div', { className: 'row' }, btn('Cofnij kreskę', undoPad, 'ghost'), btn('Wyczyść', clearPad, 'ghost')),
  actions(banBtn(s), quitBtn()),
];

function questionScreen(s, c) {
  const k = s.q.kind, q = { ...c, about: subj(s), mineQ: s.me === s.subject, mine: s.myAnswer };
  if (draftRound !== s.round) { draft = Math.round((s.q.max || 100) / 2); draftRound = s.round; }
  if (k === 'draw' && q.mineQ) return drawerScreen(s);
  // a question about one of you: what to do is underlined in the partner's color for the guesser
  const quiz = q.about && (k === 'choice' || k === 'scale') && s.mode !== 'blef';
  // the question itself is read on the projector; the phone is the pad
  const top = [roundLine(s), againLine(s)];
  // answered, partner still thinking: the pad stays, so you can change your mind until then
  if (q.mine != null && (k === 'choice' || k === 'yesno' || k === 'scale') && s.mode !== 'blef') return [
    top,
    h('div', { className: 'waiting' }, h('span', { className: 'dots', ariaHidden: true }, h('i'), h('i'), h('i')),
      h('b', { id: 'status' }, c.waiting || '✓ Wysłane'), h('small', {}, 'możesz zmienić zdanie')),
    (ANSWER[k] || ANSWER.default)(s, q),
    actions(skipBtn(), banBtn(s), quitBtn()),
  ];
  // nothing to do on the phone: say so, and point at the projector
  const idle = q.mine != null && k !== 'draw' ? c.waiting || '✓ Wysłane'
    : !q.mineQ && k === 'pick' ? 'Zaraz zobaczysz zadanie'
    : q.mineQ && k === 'dare' ? (s.q.options[0] === 'Prawda' ? 'Odpowiedz szczerze, na głos' : 'Zrób to teraz')
    : !q.mineQ && k === 'write' ? `${q.about.name} pisze dwie prawdy i jedno kłamstwo, potem zgadujesz`
    : null;
  // (not over your own statements: writing them is the whole screen)
  const turn = q.about && (k === 'pick' || k === 'dare' || s.mode === 'blef') && !(k === 'write' && q.mineQ) && spot(
    k === 'dare' ? `${s.q.options[0]} dla${q.mineQ ? ' Ciebie' : ''}` : s.mode === 'blef' ? (q.mineQ ? 'Blefujesz' : 'Blefuje') : q.mineQ ? 'Twoja kolej' : 'Wybiera', q.about);
  if (idle) return [top, turn, look(idle), actions(skipBtn(), banBtn(s), quitBtn())];
  // a talk card: read it on the projector, talk, then Dalej here
  if (k === 'talk') return [top, look(`${s.q.options[0]} · porozmawiajcie`), ANSWER.talk(s), actions(skipBtn(), banBtn(s), quitBtn())];
  return [
    top,
    turn,
    !(k === 'pick' && q.mineQ) && h('p', { className: 'do', id: 'status', style: '--c:' + (quiz && !q.mineQ ? q.about.color : c.p.color) }, (TASK[k] || TASK.default)(s, q)),
    (ANSWER[k] || ANSWER.default)(s, q),
    k === 'draw' ? btn('Poddaję się, pokaż hasło', () => act('giveup'), 'ghost') : null,
    actions(k !== 'draw' && skipBtn(), banBtn(s), quitBtn()),
  ];
}

// The result belongs to the projector: the phone does not spoil it. It counts 3-2-1 with the projector
// (700 ms a number, as in screen.html), then says to look up. Everyone taps Dalej to go on.
// Dalej then stays locked for WAIT more, so nobody skips the result before it was read
// (the browser test shortens it in localStorage, or it would wait minutes in total).
const COUNT = 2100;
let WAIT = 5000, revealAt = {};
try { WAIT = +(localStorage.getItem('duet-wait') ?? WAIT); } catch {}
const since = s => Date.now() - (revealAt[s.round] ||= Date.now());
const countLeft = s => s.mode === 'rysowanie' ? 0 : COUNT - since(s);
const lockLeft = s => (s.mode === 'rysowanie' ? 0 : COUNT) + WAIT - since(s);
// there from the start, so the layout does not jump; it fades in when the count ends and unlocks after WAIT
const nextBtn = s => h('button', { className: 'btn later', type: 'button', disabled: lockLeft(s) > 0, style: `animation-delay:${Math.max(0, countLeft(s))}ms`,
  onclick: () => act('next') }, s.round === s.rounds ? 'Zobacz wynik' : 'Dalej');
function revealScreen(s, { p }) {
  const notYet = s.pairs.flatMap(x => x.players).filter(o => o.online && !o.bot && !o.ready).map(o => o.name);
  if (p.ready) return [look('Czekamy na: ' + (s.multi ? 'pozostałych' : notYet.join(', '))), actions(banBtn(s), quitBtn())];
  const left = countLeft(s);
  return [
    left > 0 ? h('div', { className: 'count', id: 'count', ariaLive: 'polite' }, String(Math.ceil(left / 700)))
      : h('div', { className: 'look up' }, h('div', { className: 'eye', ariaHidden: true }, '👀'), h('b', {}, 'Podnieś wzrok'), h('p', { className: 'dim' }, 'Wynik jest na projektorze')),
    nextBtn(s),
    actions(banBtn(s), quitBtn()),
  ];
}
setInterval(() => {
  if (last.phase !== 'reveal') return;
  const el = $('count');
  if (!el) { // the count is over: unlock Dalej once the result had its time
    const b = document.querySelector('.btn.later:disabled');
    if (b && lockLeft(last) <= 0) { rerender(); } else if (b) b.style.setProperty('--p', Math.min(1, 1 - lockLeft(last) / WAIT).toFixed(3));
    return;
  }
  const left = countLeft(last), n = String(Math.ceil(left / 700));
  if (left <= 0) { rerender(); beep('join'); } else if (el.textContent !== n) { el.textContent = n; beep('tick'); }
}, 100);

// a letter for a year from now: only its writer sees it before then
const capsule = s => s.canWrite && h('form', { className: 'capsule', onsubmit: e => { e.preventDefault(); act('letter', '', e.target.letter.value); } },
  h('p', {}, '📬 List do Was za rok'),
  h('textarea', { name: 'letter', rows: 3, maxLength: 200, required: true, value: s.myLetter || '', placeholder: 'Jedno zdanie, które przeczytacie za rok', ariaLabel: 'List do Was za rok' }),
  h('button', { className: 'btn ghost' }, s.myLetter ? 'Popraw list' : 'Schowaj do kapsuły'),
  s.myLetter && h('p', { className: 'dim' }, '✓ List czeka w kapsule. Otworzycie go za rok.'));
let capsuleDay = '', capsuleHere = false; // capsuleHere: shown on this end screen, which re-renders
try { capsuleDay = localStorage.getItem('duet-capsule') || ''; } catch {}
const capsuleOnce = s => { // at the end of the first game of the day; after that it waits under "Więcej"
  const day = new Date().toDateString();
  if (s.canWrite && capsuleDay !== day) {
    capsuleDay = day;
    capsuleHere = true;
    try { localStorage.setItem('duet-capsule', day); } catch {}
  }
  return capsuleHere && capsule(s);
};
const endScreen = s => [h('div', { className: 'endcard' }, summary(s, true)), btn('Jeszcze raz', () => act('again')), btn('Menu', () => act('quit'), 'ghost'), capsuleOnce(s)];

const SCREENS = { lobby: lobbyScreen, question: questionScreen, reveal: revealScreen, end: endScreen };

// skipping a round or ending the game is a vote: the others say yes or no here
function voteBox(v) {
  const what = v.kind === 'skip' ? 'pominąć tę rundę' : 'zakończyć grę';
  // a proposal you have to answer stands out; one you made just waits
  return h('div', { className: 'vote' + (v.agreed ? ' sent' : '') },
    h('div', { className: 'vote-icon' }, ico(v.kind === 'skip' ? 'skip' : 'quit')),
    v.agreed
      ? [h('p', {}, `Czekamy na zgodę: ${v.waiting.join(', ')}`), btn('Wycofaj', () => act('no'), 'ghost')]
      : [h('p', {}, `${v.by} chce ${what}. Zgadzasz się?`),
         h('div', { className: 'vote-buttons' }, h('button', { className: 'btn', type: 'button', onclick: () => act(v.kind) }, iconed('✓', 'Zgoda')),
           h('button', { className: 'btn ghost', type: 'button', onclick: () => act('no') }, iconed('✕', 'Nie')))]);
}

let draft = 50, draftRound = 0; // slider position in "skala", kept across re-renders
let last = { phase: 'lobby', players: [], me: -1 }, lastKey = '', shown = {};
function show(s) {
  last = s;
  const p = s.players[s.me], other = s.players[1 - s.me];
  const inGame = p && !editing;
  const menu = inGame && s.phase === 'lobby' && other && other.online;
  const home = s.pair === 1 && !s.multi; // the saved list, stats and backup: couple 1, no guests around
  $('join').hidden = !!inGame;
  document.querySelector('main').classList.toggle('in', !!inGame);
  document.querySelector('main').classList.toggle('drawing',
    !!inGame && s.phase === 'question' && s.q.kind === 'draw' && s.me === s.subject);
  const taken = s.pairs.flatMap(x => x.players).filter(o => !(p && o.name === p.name && o.color === p.color)).map(o => o.color);
  if (!inGame && taken.includes(me.color)) { // the projector tells you apart by color
    me.color = COLORS.find(c => !taken.includes(c));
    drawColors();
  }
  $('stakeBox').hidden = !(menu && s.scored); // a reward needs a winner, so only in games with points
  if (document.activeElement !== $('stake')) $('stake').value = s.myStake || '';
  if (!inGame) { lastKey = ''; return $('app').replaceChildren(); }
  if (s.phase === 'lobby' || s.phase === 'end') revealAt = {}; // the next game counts its rounds from 1 again

  // Who has answered changes while you are still choosing: update that line only,
  // so a re-render never interrupts dragging the slider.
  const waiting = s.phase !== 'question' || s.myAnswer == null ? ''
    : !s.answered[1 - s.me] ? `${other.name} jeszcze myśli…` : s.multi ? 'Czekamy na pozostałe pary…' : '';
  // ...and a partner's phone locking must not wipe what you are typing.
  if (s.left) endAt = Date.now() + s.left;
  // (Fields are removed rather than overwritten: a field that appears later would change the key order.)
  const { answered, left, guesses, ...rest } = s;
  const key = JSON.stringify({ ...rest, players: s.players.map(o => o.name + o.color + !!o.ready), menu });
  if (key === lastKey) {
    if ($('status') && s.myAnswer != null) $('status').textContent = waiting || '✓ Wysłane';
    return;
  }
  lastKey = key;
  // a new screen slides in; small updates of the same one do not
  const main = document.querySelector('main'), fresh = s.phase !== shown.phase || s.round !== shown.round || shown.editing !== editing;
  if (fresh) {
    main.classList.remove('fresh');
    void main.offsetWidth; // restart the animation
    main.classList.add('fresh');
  }
  if (fresh) sheetOpen = false;
  if (s.phase !== 'end') capsuleHere = false;
  shown = { phase: s.phase, round: s.round, editing };

  // a couple that sat down while a game was on waits for the next one
  if (s.phase !== 'lobby' && !s.pairs.some(x => x.n === s.pair)) {
    return $('app').replaceChildren(h('div', { className: 'badge', style: '--c:' + p.color }, p.name),
      h('p', { className: 'dim' }, 'Gra już trwa. Dołączycie do następnej, patrzcie na ekran.'));
  }

  // dares, bluffs and drawings go round the table: the couples whose turn it is not just watch
  if (s.active && s.active !== s.pair) {
    return $('app').replaceChildren(
      roundLine(s),
      h('h2', {}, `Teraz gra: ${pairName(activePair(s))}`),
      h('p', { className: 'dim' }, 'Patrzcie na ekran. Wasza kolej zaraz przyjdzie.'),
      s.phase === 'reveal' && nextBtn(s));
  }

  // one function per screen; a vote to skip or end shows above whatever screen it is
  const kids = (SCREENS[s.phase] || endScreen)(s, { p, other, menu, home, waiting });
  if (s.vote && s.phase !== 'lobby') kids.push(h('div', { className: 'overlay' }, voteBox(s.vote)));
  // a new screen is built anew; on the same one only what changed is updated
  if (fresh) $('app').replaceChildren(...kids.flat(3).filter(Boolean)); else morph($('app'), kids);
}

let first = true;
live('/events?id=' + me.id, s => {
  // A phone that played before goes straight in when the page opens. Only then:
  // someone removed from the table later must not bounce right back.
  if (first && s.me < 0 && me.name) join();
  first = false;
  show(s);
});
</script>
</body>
</html>
