<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0717">
<title>Duet – pilot</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="phone">
  <h1>Duet</h1>

  <!-- static, so typing a name is never wiped by a state update -->
  <form id="join" class="stack" hidden>
    <label>Twoje imię
      <input id="name" maxlength="20" autocomplete="given-name" required>
    </label>
    <div class="colors" id="colors" role="group" aria-label="Twój kolor"></div>
    <fieldset class="picker" id="forms"><legend>Jak się do Ciebie zwracać w pytaniach?</legend></fieldset>
    <fieldset class="picker" id="pairs"><legend>Która para? (Wy dwoje wybieracie ten sam numer)</legend></fieldset>
    <button class="btn">Dołącz</button>
  </form>

  <div id="app"></div>

  <!-- static for the same reason; shown in the menu, placed before Start by CSS order -->
  <label id="stakeBox" hidden>Twoja tajna stawka: co przegrany robi dla Ciebie?
    <input id="stake" maxlength="80" placeholder="np. masaż stóp" enterkeyhint="done">
  </label>
  <p id="err" role="alert"></p>
</main>
<script src="/static/common.js"></script>
<script>
const COLORS = ['#ff3d9a', '#9b5cff', '#3db8ff', '#3dffa8', '#ffd23d', '#ff7a3d', '#2ee6d6', '#b6ff3d'];

// Profile lives on the phone so a rescan (or a dropped connection) puts you straight back in.
let me = {};
try { me = JSON.parse(localStorage.getItem('duet') || '{}'); } catch {}
if (!me.id) {
  // not crypto.randomUUID: it is unavailable on plain http
  me.id = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
}
me.color ||= COLORS[Math.floor(Math.random() * COLORS.length)];

$('name').value = me.name || '';
function drawColors() {
  $('colors').replaceChildren(...COLORS.map(c => h('button', {
    type: 'button', style: '--c:' + c, ariaLabel: 'Kolor ' + c, ariaPressed: c === me.color,
    onclick: () => { me.color = c; drawColors(); },
  })));
}
drawColors();

// "byłeś" or "byłaś": the questions are spelled for the form picked here.
function drawForms() {
  $('forms').replaceChildren($('forms').firstElementChild, ...[['m', 'jak do niego'], ['f', 'jak do niej']].map(([form, label]) => h('button', {
    type: 'button', ariaPressed: me.form === form, onclick: () => { me.form = form; drawForms(); },
  }, label)));
}
drawForms();

// Up to four couples can play at one projector; partners pick the same number.
me.pair ||= 0;
function drawPairs() {
  $('pairs').replaceChildren($('pairs').firstElementChild, ...[0, 1, 2, 3].map(n => h('button', {
    type: 'button', ariaPressed: me.pair === n, onclick: () => { me.pair = n; drawPairs(); },
  }, String(n + 1))));
}
drawPairs();

// The join code comes with the QR link; keep it, so reopening the page without it still works.
me.key = new URLSearchParams(location.search).get('k') || me.key || '';

async function post(path, body) {
  $('err').textContent = '';
  const r = await fetch(path, { method: 'POST', body: JSON.stringify({ id: me.id, ...body }), signal: AbortSignal.timeout?.(5000) /* missing before iOS 16: then no time limit */ }).catch(() => null);
  if (!r || !r.ok) $('err').textContent = r ? await r.text() : 'Brak połączenia z grą';
  return !!r && r.ok;
}
const act = (act, key, value) => post('/api/act', { act, key, value, step: last.step });
async function join() {
  if (!await post('/api/join', { name: me.name, color: me.color, form: me.form || '', key: me.key, pair: me.pair })) return false;
  try { localStorage.setItem('duet', JSON.stringify(me)); } catch {}
  return true;
}

let editing = false;
$('join').onsubmit = async e => {
  e.preventDefault();
  me.name = $('name').value.trim();
  if (await join()) { editing = false; lastKey = ''; show(last); }
};

// The phone has nothing to do: one clear sign to look at the projector instead.
const look = text => h('div', { className: 'look' }, h('div', { className: 'eye', ariaHidden: true }, '👀'), h('b', {}, 'Patrz na projektor'),
  text && h('p', { className: 'dim', id: 'status' }, text));
const btn = (label, onclick, cls = '') => h('button', { className: 'btn ' + cls, type: 'button', onclick }, label);

// One row of options from the menu (mode / tone / length); either phone may change it.
function picker(s, key, title) {
  return h('fieldset', { className: 'picker ' + key }, h('legend', {}, title),
    s.menu[key].map(o => h('button', {
      type: 'button', ariaPressed: s.cfg[key] === o.id, onclick: () => act('config', key, o.id),
      disabled: key === 'mode' && (s.solo || []).includes(o.id), // with several couples: only the modes everyone plays at once
    }, o.name)));
}

// The drawing pad of "rysowanie": one canvas per round, kept across re-renders.
// Points are queued and sent in order, a batch at a time, so strokes arrive as drawn.
let padEl, padRound = 0, queue = [], sending = false, ink = [], inkColors = [], penColor = 0; // ink: own strokes, to repaint after an undo
function pad(s) {
  if (padEl && padRound === s.round) return padEl;
  padRound = s.round;
  queue = [];
  ink = [];
  inkColors = [];
  const c = padEl = h('canvas', { className: 'pad', width: 1000, height: 1000 }), ctx = pen(c);
  const at = e => {
    const r = c.getBoundingClientRect(), fit = v => Math.max(0, Math.min(1000, Math.round(v * 1000)));
    return [fit((e.clientX - r.left) / r.width), fit((e.clientY - r.top) / r.height)];
  };
  let last = null;
  c.onpointerdown = e => {
    c.setPointerCapture(e.pointerId);
    last = at(e);
    ctx.strokeStyle = PALETTE[penColor][0];
    line(ctx, ...last, last[0] + .1, last[1]); // a tap leaves a dot
    queue.push({ k: 'new:' + penColor, p: [...last] });
    ink.push([...last]);
    inkColors.push(penColor);
  };
  c.onpointermove = e => {
    const p = at(e);
    if (!last || p[0] === last[0] && p[1] === last[1]) return;
    line(ctx, ...last, ...p);
    last = p;
    ink[ink.length - 1].push(...p);
    const tail = queue[queue.length - 1];
    if (tail && tail.p.length < 200) tail.p.push(...p); else queue.push({ k: '', p });
  };
  c.onpointerup = c.onpointercancel = () => { last = null; flush(); };
  return c;
}
async function flush() {
  if (sending) return;
  sending = true;
  while (queue.length) {
    const b = queue.shift();
    await act('draw', b.k, b.p.join(','));
  }
  sending = false;
}
setInterval(flush, 120);
function clearPad() {
  queue = [];
  ink = [];
  inkColors = [];
  paint(padEl.getContext('2d'), ink);
  act('clear');
}
async function undoPad() {
  await flush(); // the server must have the stroke before it can drop it
  ink.pop();
  inkColors.pop();
  paint(padEl.getContext('2d'), ink, inkColors);
  act('undo');
}

let infoOpen = false; // the folded-away "players and backup" section

const saveStake = () => act('stake', '', $('stake').value);
$('stake').onchange = saveStake;

// ---- the screens of the phone: show() picks one by phase; c = { p, other, menu, home, waiting } ----

// rare actions are small and side by side, so they never compete with the answers
const minor = (...bs) => h('div', { className: 'minor' }, bs.filter(Boolean));
const quitBtn = () => h('button', { type: 'button', onclick: () => confirm('Zakończyć grę i wrócić do menu?') && act('quit') }, 'Zakończ grę');
const skipBtn = () => h('button', { type: 'button', onclick: () => confirm('Pominąć tę rundę? Nikt nie dostanie punktów.') && act('skip') }, 'Pomiń rundę');
// a question you never want again: gone from every later game (the household decides, not guests)
const banBtn = s => s.pair === 1 && h('button', { type: 'button', disabled: !!s.banned,
  onclick: () => confirm('To pytanie już nigdy nie wróci. Na pewno?') && act('ban') }, s.banned ? '✓ Nie wróci' : 'Nie pokazuj więcej');
const roundLine = s => h('p', { className: 'dim' }, `${cardMode(s) ? 'Karta' : 'Runda'} ${s.round} z ${s.rounds}`);

function lobbyScreen(s, { p, other, menu, home }) {
  return [
    h('div', { className: 'badge', style: '--c:' + p.color }, p.name + (s.multi ? ` · para ${s.pair}` : '')),
    menu
      ? [picker(s, 'mode', 'Gra'), h('p', { className: 'dim rulebox' }, s.rule),
         picker(s, 'tone', 'Ton'), picker(s, 'length', 'Długość'),
         btn('Start', async () => { await saveStake(); act('start'); }, 'after start')]
      : [h('p', { className: 'dim' }, 'Czekamy na drugą osobę…'),
         !other && btn('Zagraj z botem (test w pojedynkę)', () => act('bot'), 'ghost')],
    // everything not needed every evening, folded away; stays open across re-renders,
    // or any update would fold it away under your finger
    h('details', { className: 'after', open: infoOpen, ontoggle: e => { infoOpen = e.target.open; } }, h('summary', {}, 'Więcej'),
      menu && home && s.listLen > 0 && btn(s.list ? 'Ukryj naszą listę' : `Pokaż na ekranie naszą listę (${s.listLen})`, () => act('list'), 'ghost'),
      menu && home && s.hasStats && btn(s.stats ? 'Ukryj statystyki' : 'Pokaż statystyki na ekranie', () => act('stats'), 'ghost'),
      // the saved list is managed here while the projector shows it
      s.list && h('div', { className: 'yes' }, s.list.map(it => h('div', { className: 'row' },
        h('span', { className: it.done ? 'done' : '' }, it.text),
        h('button', { type: 'button', ariaLabel: it.done ? 'Oznacz jako niezrobione' : 'Oznacz jako zrobione', ariaPressed: it.done, onclick: () => act('yesdone', '', it.text) }, '✓'),
        h('button', { type: 'button', ariaLabel: 'Usuń z listy', onclick: () => confirm(`Usunąć „${it.text}” z listy?`) && act('yesdel', '', it.text) }, '✕')))),
      // trying things out alone: the bot partner can go, and a couple of bots can join for the ranking
      menu && other.bot && [
        btn('Usuń bota', () => act('bot'), 'ghost'),
        btn(s.pairs.some(x => x.players.every(o => o.bot)) ? 'Usuń parę botów' : 'Dodaj parę botów', () => act('botpair'), 'ghost')],
      btn('Zmień imię lub kolor', () => { editing = true; lastKey = ''; show(last); }, 'ghost'),
      h('small', {}, 'Gracze'),
      s.pairs.flatMap(x => x.players.map((o, seat) => h('div', { className: 'row' },
        h('span', {}, `${o.name} · para ${x.n}` + (o.online ? '' : ' · rozłączony')),
        !(x.n === s.pair && seat === s.me) && h('button', { type: 'button', ariaLabel: `Usuń gracza ${o.name}`,
          onclick: () => confirm(`Usunąć gracza ${o.name}? Zwolni się jego miejsce.`) && act('kick', String(x.n), String(seat)) }, '✕')))),
      home && h('small', {}, 'Kopia zapasowa'),
      home && h('a', { className: 'btn ghost', href: '/api/backup?id=' + me.id, download: '' }, 'Pobierz kopię zapasową'),
      home && h('label', { className: 'btn ghost' }, 'Wczytaj kopię zapasową',
        h('input', { type: 'file', accept: 'application/json,.json', hidden: true, onchange: async e => {
          const file = e.target.files[0];
          if (!file || !confirm('Wczytanie kopii zastąpi zapisane pytania, listę i statystyki. Kontynuować?')) return;
          $('err').textContent = '';
          const r = await fetch('/api/restore?id=' + me.id, { method: 'POST', body: file }).catch(() => null);
          $('err').textContent = !r ? 'Brak połączenia z grą' : r.ok ? 'Kopia wczytana.' : await r.text();
        } }))),
  ];
}

// What the phone asks you to do, per kind of question; q = c plus { about, mineQ, mine }.
// Choices and scales (and any new kind) fall through to TASK.default.
const TASK = {
  draw: (s, q) => `Co rysuje ${q.about.name}? Patrz na projektor i zgaduj`,
  pick: (s, q) => q.mineQ ? 'Twój wybór' : `${q.about.name} wybiera…`,
  talk: s => s.q.options[0] + ' · bez punktów, po prostu porozmawiajcie',
  text: () => 'Wpisz pierwsze skojarzenie — jedno słowo',
  yesno: () => 'Tajne: ekran pokaże tylko wspólne TAK',
  dare: (s, q) => q.mineQ ? `${s.q.options[0]} dla Ciebie!` : `${s.q.options[0]} dla: ${q.about.name}. Oceń, gdy skończy`,
  write: (s, q) => q.mineQ ? 'Napisz o sobie dwie prawdy i jedno kłamstwo. Zaznacz kłamstwo.' : `${q.about.name} pisze dwie prawdy i jedno kłamstwo…`,
  default: (s, q) => s.mode === 'blef' ? (q.mineQ ? 'Zaznaczone zdanie to Twoje kłamstwo' : 'Które zdanie to kłamstwo?')
    : !q.about ? 'Wybierz w tajemnicy' : q.mineQ ? '🙋 Pytanie o Ciebie — odpowiedz szczerze' : `🔮 Zgadujesz, co odpowie ${q.about.name}`,
};

// The word form of "telepatia" and of guessing a drawing.
const wordForm = (s, q) => q.mine != null
  ? h('div', { className: 'badge' }, s.myText)
  : h('form', { className: 'stack', onsubmit: e => {
      e.preventDefault();
      const word = $('word').value;
      $('word').value = ''; // cleared at once, so the next guess in "rysowanie" can be typed right away
      act('answer', '', word);
    } },
      s.q.kind === 'draw' && clock(s),
      h('input', { id: 'word', maxLength: 30, required: true, autocapitalize: 'off', autocomplete: 'off', enterKeyHint: 'send', ariaLabel: 'Twoje skojarzenie' }),
      h('button', { className: 'btn' }, 'Wyślij'));

// How you answer, per kind of question. Choices (and yes/no) fall through to ANSWER.default.
const ANSWER = {
  talk: s => btn(s.round === s.rounds ? 'Zakończ rozmowę' : 'Dalej', () => act('next')),
  pick: (s, q) => q.mineQ && s.q.options.map((text, i) => h('button', { className: 'btn pick', type: 'button', onclick: () => act('answer', '', String(i)) }, text)),
  dare: (s, q) => !q.mineQ && [btn('Zaliczone ✓', () => act('answer', '', '0')), btn('Odpuszczone ✗', () => act('answer', '', '1'), 'ghost')],
  write: (s, q) => q.mineQ && h('form', { className: 'stack', onsubmit: e => {
    e.preventDefault();
    const f = new FormData(e.target);
    act('answer', f.get('lie'), f.getAll('st').map(t => t.replace(/\s+/g, ' ').trim()).join('\n')); // a typed Enter must not split a statement
  } },
    [0, 1, 2].map(i => h('div', { className: 'stmt' },
      h('textarea', { name: 'st', rows: 3, maxLength: 80, required: true, autocomplete: 'off', placeholder: `Zdanie ${i + 1}`, ariaLabel: `Zdanie ${i + 1}` }),
      h('label', {}, h('input', { type: 'radio', name: 'lie', value: i, required: true }), 'kłamstwo'))),
    h('button', { className: 'btn' }, 'Gotowe')),
  text: wordForm,
  draw: wordForm,
  scale: (s, q) => q.mine != null
    ? h('div', { className: 'big' }, String(q.mine))
    : [h('div', { className: 'big', id: 'val' }, String(draft)),
       h('input', { type: 'range', min: 0, max: s.q.max || 100, value: draft, ariaLabel: s.q.text,
         oninput: e => { draft = +e.target.value; $('val').textContent = draft; } }),
       h('div', { className: 'ends' }, ends(s.q).map(t => h('span', {}, t))),
       btn('Zatwierdź', () => act('answer', '', String(draft)))],
  default: (s, q) => s.q.options.map((text, i) => h('button', {
    className: 'btn pick' + (s.q.options.length > 2 ? ' small' : ''), type: 'button',
    ariaPressed: q.mine === i, onclick: () => act('answer', '', String(i)),
  }, text)),
};

// drawing needs the whole phone screen: just the word, the clock and the pad
const drawerScreen = s => [
  h('div', { className: 'row' }, h('h2', {}, s.q.text), clock(s)),
  pad(s),
  h('div', { className: 'swatches' }, PALETTE.map(([color, name], i) => h('button', {
    type: 'button', ariaLabel: 'Kolor: ' + name, ariaPressed: penColor === i, style: '--c:' + color,
    onclick: e => { penColor = i; for (const b of e.currentTarget.parentNode.children) b.ariaPressed = b === e.currentTarget; },
  }))),
  h('div', { className: 'row' }, btn('Cofnij kreskę', undoPad, 'ghost'), btn('Wyczyść', clearPad, 'ghost')),
];

function questionScreen(s, c) {
  const k = s.q.kind, q = { ...c, about: subj(s), mineQ: s.me === s.subject, mine: s.myAnswer };
  if (draftRound !== s.round) { draft = Math.round((s.q.max || 100) / 2); draftRound = s.round; }
  if (k === 'draw' && q.mineQ) return drawerScreen(s);
  // a question about one of you: the guesser reads it addressed to the partner, not to themselves
  const quiz = q.about && (k === 'choice' || k === 'scale') && s.mode !== 'blef';
  const text = quiz && !q.mineQ && s.q.text ? `${q.about.name}, ${s.q.text[0].toLowerCase()}${s.q.text.slice(1)}` : s.q.text;
  const top = [roundLine(s), s.rule && h('p', { className: 'rulebox' }, s.rule)];
  // nothing to do on the phone: say so, and point at the projector
  const idle = q.mine != null && k !== 'draw' ? c.waiting || '✓ Wysłane'
    : !q.mineQ && k === 'pick' ? `${q.about.name} wybiera: prawda czy wyzwanie`
    : !q.mineQ && k === 'write' ? `${q.about.name} pisze dwie prawdy i jedno kłamstwo — potem zgadujesz`
    : null;
  if (idle) return [top, look(idle), minor(skipBtn(), banBtn(s), quitBtn())];
  return [
    top,
    h('p', { className: 'do', id: 'status', style: '--c:' + (quiz && !q.mineQ ? q.about.color : c.p.color) }, (TASK[k] || TASK.default)(s, q)),
    text && h('h2', {}, text),
    (ANSWER[k] || ANSWER.default)(s, q),
    k === 'draw' ? btn('Poddaję się — pokaż hasło', () => act('giveup'), 'ghost') : null,
    minor(k !== 'draw' && skipBtn(), banBtn(s), quitBtn()),
  ];
}

// the result belongs to the projector: the phone does not spoil it. Everyone taps Dalej to go on.
function revealScreen(s, { p }) {
  const notYet = s.pairs.flatMap(x => x.players).filter(o => o.online && !o.bot && !o.ready).map(o => o.name);
  return p.ready
    ? [look('Czekamy na: ' + (s.multi ? 'pozostałych' : notYet.join(', '))), minor(banBtn(s), quitBtn())]
    : [look('Wynik jest na projektorze'), btn(s.round === s.rounds ? 'Zobacz wynik' : 'Dalej', () => act('next')), minor(banBtn(s), quitBtn())];
}

const endScreen = s => [summary(s), btn('Jeszcze raz', () => act('again')), btn('Menu', () => act('quit'), 'ghost')];

const SCREENS = { lobby: lobbyScreen, question: questionScreen, reveal: revealScreen, end: endScreen };

// skipping a round or ending the game is a vote: the others say yes or no here
function voteBox(v) {
  const what = v.kind === 'skip' ? 'pominąć tę rundę' : 'zakończyć grę';
  return h('div', { className: 'vote' }, v.agreed
    ? [h('p', {}, `Czekamy na zgodę: ${v.waiting.join(', ')}`), btn('Wycofaj', () => act('no'), 'ghost')]
    : [h('p', {}, `${v.by} chce ${what}. Zgadzasz się?`), btn('Zgoda', () => act(v.kind)), btn('Nie', () => act('no'), 'ghost')]);
}

let draft = 50, draftRound = 0; // slider position in "skala", kept across re-renders
let last = { phase: 'lobby', players: [], me: -1 }, lastKey = '';
function show(s) {
  last = s;
  const p = s.players[s.me], other = s.players[1 - s.me];
  const inGame = p && !editing;
  const menu = inGame && s.phase === 'lobby' && other && other.online;
  const home = s.pair === 1 && !s.multi; // the saved list, stats and backup: couple 1, no guests around
  $('join').hidden = !!inGame;
  document.querySelector('main').classList.toggle('in', !!inGame);
  document.querySelector('main').classList.toggle('drawing',
    !!inGame && s.phase === 'question' && s.q.kind === 'draw' && s.me === s.subject);
  const taken = s.pairs.flatMap(x => x.players).filter(o => !(p && o.name === p.name && o.color === p.color)).map(o => o.color);
  if (!inGame && taken.includes(me.color)) { // the projector tells you apart by color
    me.color = COLORS.find(c => !taken.includes(c));
    drawColors();
  }
  $('stakeBox').hidden = !(menu && s.scored); // a reward needs a winner, so only in games with points
  if (document.activeElement !== $('stake')) $('stake').value = s.myStake || '';
  if (!inGame) { lastKey = ''; return $('app').replaceChildren(); }

  // Who has answered changes while you are still choosing: update that line only,
  // so a re-render never interrupts dragging the slider.
  const waiting = s.phase !== 'question' || s.myAnswer == null ? ''
    : !s.answered[1 - s.me] ? `Czekamy na: ${other.name}` : s.multi ? 'Czekamy na pozostałe pary…' : '';
  // ...and a partner's phone locking must not wipe what you are typing.
  if (s.left) endAt = Date.now() + s.left;
  // (Fields are removed rather than overwritten: a field that appears later would change the key order.)
  const { answered, left, guesses, ...rest } = s;
  const key = JSON.stringify({ ...rest, players: s.players.map(o => o.name + o.color + !!o.ready), menu });
  if (key === lastKey) {
    if ($('status') && s.myAnswer != null) $('status').textContent = waiting || '✓ Wysłane';
    return;
  }
  lastKey = key;

  // a couple that sat down while a game was on waits for the next one
  if (s.phase !== 'lobby' && !s.pairs.some(x => x.n === s.pair)) {
    return $('app').replaceChildren(h('div', { className: 'badge', style: '--c:' + p.color }, p.name),
      h('p', { className: 'dim' }, 'Gra już trwa. Dołączycie do następnej — patrzcie na ekran.'));
  }

  // dares, bluffs and drawings go round the table: the couples whose turn it is not just watch
  if (s.active && s.active !== s.pair) {
    return $('app').replaceChildren(
      roundLine(s),
      h('h2', {}, `Teraz gra: ${pairName(activePair(s))}`),
      h('p', { className: 'dim' }, 'Patrzcie na ekran. Wasza kolej zaraz przyjdzie.'),
      s.phase === 'reveal' && btn(s.round === s.rounds ? 'Zobacz wynik' : 'Dalej', () => act('next')));
  }

  // one function per screen; a vote to skip or end shows above whatever screen it is
  const kids = (SCREENS[s.phase] || endScreen)(s, { p, other, menu, home, waiting });
  if (s.vote && s.phase !== 'lobby') kids.unshift(voteBox(s.vote));
  $('app').replaceChildren(...kids.flat(3).filter(Boolean));
}

let first = true;
live('/events?id=' + me.id, s => {
  // A phone that played before goes straight in when the page opens. Only then:
  // someone removed from the table later must not bounce right back.
  if (first && s.me < 0 && me.name) join();
  first = false;
  show(s);
});
</script>
