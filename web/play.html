<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0717">
<title>Duet – pilot</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="phone">
  <h1>Duet</h1>

  <!-- static, so typing a name is never wiped by a state update -->
  <form id="join" class="stack" hidden>
    <label>Twoje imię
      <input id="name" maxlength="20" autocomplete="given-name" required>
    </label>
    <div class="colors" id="colors" role="group" aria-label="Twój kolor"></div>
    <fieldset class="picker" id="forms"><legend>Jak się do Ciebie zwracać w pytaniach?</legend></fieldset>
    <fieldset class="picker" id="pairs"><legend>Która para? (Wy dwoje wybieracie ten sam numer)</legend></fieldset>
    <button class="btn">Dołącz</button>
  </form>

  <div id="app"></div>

  <!-- static for the same reason; shown in the menu, placed before Start by CSS order -->
  <label id="stakeBox" hidden>Twoja tajna stawka: co przegrany robi dla Ciebie?
    <input id="stake" maxlength="80" placeholder="np. masaż stóp" enterkeyhint="done">
  </label>
  <p id="err" role="alert"></p>
</main>
<script src="/static/common.js"></script>
<script>
const COLORS = ['#ff3d9a', '#9b5cff', '#3db8ff', '#3dffa8', '#ffd23d', '#ff7a3d'];

// Profile lives on the phone so a rescan (or a dropped connection) puts you straight back in.
let me = {};
try { me = JSON.parse(localStorage.getItem('duet') || '{}'); } catch {}
if (!me.id) {
  // not crypto.randomUUID: it is unavailable on plain http
  me.id = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
}
me.color ||= COLORS[Math.floor(Math.random() * COLORS.length)];

$('name').value = me.name || '';
function drawColors() {
  $('colors').replaceChildren(...COLORS.map(c => h('button', {
    type: 'button', style: '--c:' + c, ariaLabel: 'Kolor ' + c, ariaPressed: c === me.color,
    onclick: () => { me.color = c; drawColors(); },
  })));
}
drawColors();

// "byłeś" or "byłaś": the questions are spelled for the form picked here.
function drawForms() {
  $('forms').replaceChildren($('forms').firstElementChild, ...[['m', 'jak do niego'], ['f', 'jak do niej']].map(([form, label]) => h('button', {
    type: 'button', ariaPressed: me.form === form, onclick: () => { me.form = form; drawForms(); },
  }, label)));
}
drawForms();

// Up to four couples can play at one projector; partners pick the same number.
me.pair ||= 0;
function drawPairs() {
  $('pairs').replaceChildren($('pairs').firstElementChild, ...[0, 1, 2, 3].map(n => h('button', {
    type: 'button', ariaPressed: me.pair === n, onclick: () => { me.pair = n; drawPairs(); },
  }, String(n + 1))));
}
drawPairs();

// The join code comes with the QR link; keep it, so reopening the page without it still works.
me.key = new URLSearchParams(location.search).get('k') || me.key || '';

async function post(path, body) {
  $('err').textContent = '';
  const r = await fetch(path, { method: 'POST', body: JSON.stringify({ id: me.id, ...body }) }).catch(() => null);
  if (!r || !r.ok) $('err').textContent = r ? await r.text() : 'Brak połączenia z grą';
  return !!r && r.ok;
}
const act = (act, key, value) => post('/api/act', { act, key, value });
async function join() {
  if (!await post('/api/join', { name: me.name, color: me.color, form: me.form || '', key: me.key, pair: me.pair })) return false;
  try { localStorage.setItem('duet', JSON.stringify(me)); } catch {}
  return true;
}

let editing = false;
$('join').onsubmit = async e => {
  e.preventDefault();
  me.name = $('name').value.trim();
  if (await join()) { editing = false; lastKey = ''; show(last); }
};

const btn = (label, onclick, cls = '') => h('button', { className: 'btn ' + cls, type: 'button', onclick }, label);

// One row of options from the menu (mode / tone / length); either phone may change it.
function picker(s, key, title) {
  return h('fieldset', { className: 'picker' }, h('legend', {}, title),
    s.menu[key].map(o => h('button', {
      type: 'button', ariaPressed: s.cfg[key] === o.id, onclick: () => act('config', key, o.id),
      disabled: key === 'mode' && (s.solo || []).includes(o.id), // with several couples: only the modes everyone plays at once
    }, o.name)));
}

// The drawing pad of "rysowanie": one canvas per round, kept across re-renders.
// Points are queued and sent in order, a batch at a time, so strokes arrive as drawn.
let padEl, padRound = 0, queue = [], sending = false, ink = []; // ink: own strokes, to repaint after an undo
function pad(s) {
  if (padEl && padRound === s.round) return padEl;
  padRound = s.round;
  queue = [];
  ink = [];
  const c = padEl = h('canvas', { className: 'pad', width: 1000, height: 1000 }), ctx = pen(c);
  const at = e => {
    const r = c.getBoundingClientRect(), fit = v => Math.max(0, Math.min(1000, Math.round(v * 1000)));
    return [fit((e.clientX - r.left) / r.width), fit((e.clientY - r.top) / r.height)];
  };
  let last = null;
  c.onpointerdown = e => {
    c.setPointerCapture(e.pointerId);
    last = at(e);
    line(ctx, ...last, last[0] + .1, last[1]); // a tap leaves a dot
    queue.push({ k: 'new', p: [...last] });
    ink.push([...last]);
  };
  c.onpointermove = e => {
    const p = at(e);
    if (!last || p[0] === last[0] && p[1] === last[1]) return;
    line(ctx, ...last, ...p);
    last = p;
    ink[ink.length - 1].push(...p);
    const tail = queue[queue.length - 1];
    if (tail && tail.p.length < 200) tail.p.push(...p); else queue.push({ k: '', p });
  };
  c.onpointerup = c.onpointercancel = () => { last = null; flush(); };
  return c;
}
async function flush() {
  if (sending) return;
  sending = true;
  while (queue.length) {
    const b = queue.shift();
    await act('draw', b.k, b.p.join(','));
  }
  sending = false;
}
setInterval(flush, 120);
function clearPad() {
  queue = [];
  ink = [];
  paint(padEl.getContext('2d'), ink);
  act('clear');
}
async function undoPad() {
  await flush(); // the server must have the stroke before it can drop it
  ink.pop();
  paint(padEl.getContext('2d'), ink);
  act('undo');
}

const saveStake = () => act('stake', '', $('stake').value);
$('stake').onchange = saveStake;

let draft = 50, draftRound = 0; // slider position in "skala", kept across re-renders
let last = { phase: 'lobby', players: [], me: -1 }, lastKey = '';
function show(s) {
  last = s;
  const p = s.players[s.me], other = s.players[1 - s.me];
  const inGame = p && !editing;
  const menu = inGame && s.phase === 'lobby' && other && other.online;
  $('join').hidden = !!inGame;
  document.querySelector('main').classList.toggle('drawing',
    !!inGame && s.phase === 'question' && s.q.kind === 'draw' && s.me === s.subject);
  const taken = s.pairs.flatMap(x => x.players).filter(o => !(p && o.name === p.name && o.color === p.color)).map(o => o.color);
  if (!inGame && taken.includes(me.color)) { // the projector tells you apart by color
    me.color = COLORS.find(c => !taken.includes(c));
    drawColors();
  }
  $('stakeBox').hidden = !(menu && s.scored); // a reward needs a winner, so only in games with points
  if (document.activeElement !== $('stake')) $('stake').value = s.myStake || '';
  if (!inGame) { lastKey = ''; return $('app').replaceChildren(); }

  // Who has answered changes while you are still choosing: update that line only,
  // so a re-render never interrupts dragging the slider.
  const waiting = s.phase !== 'question' || s.myAnswer == null ? ''
    : !s.answered[1 - s.me] ? `Czekamy na: ${other.name}` : s.multi ? 'Czekamy na pozostałe pary…' : '';
  // ...and a partner's phone locking must not wipe what you are typing.
  if (s.left) endAt = Date.now() + s.left;
  // (Fields are removed rather than overwritten: a field that appears later would change the key order.)
  const { answered, left, guesses, ...rest } = s;
  const key = JSON.stringify({ ...rest, players: s.players.map(o => o.name + o.color), menu });
  if (key === lastKey) {
    if ($('status')) $('status').textContent = waiting;
    return;
  }
  lastKey = key;

  // a couple that sat down while a game was on waits for the next one
  if (s.phase !== 'lobby' && !s.pairs.some(x => x.n === s.pair)) {
    return $('app').replaceChildren(h('div', { className: 'badge', style: '--c:' + p.color }, p.name),
      h('p', { className: 'dim' }, 'Gra już trwa. Dołączycie do następnej — patrzcie na ekran.'));
  }

  const quit = btn('Zakończ grę', () => confirm('Zakończyć grę i wrócić do menu?') && act('quit'), 'ghost');
  const skip = btn('Pomiń rundę', () => confirm('Pominąć tę rundę? Nikt nie dostanie punktów.') && act('skip'), 'ghost');
  let kids;
  if (s.phase === 'lobby') {
    kids = [
      h('div', { className: 'badge', style: '--c:' + p.color }, p.name + (s.multi ? ` · para ${s.pair}` : '')),
      menu
        ? [picker(s, 'mode', 'Gra'), picker(s, 'tone', 'Ton'), picker(s, 'length', 'Długość'),
           btn('Start', async () => { await saveStake(); act('start'); }, 'after'),
           s.listLen > 0 && btn(s.list ? 'Ukryj naszą listę' : `Pokaż na ekranie naszą listę (${s.listLen})`, () => act('list'), 'ghost after'),
           s.hasStats && btn(s.stats ? 'Ukryj statystyki' : 'Pokaż statystyki na ekranie', () => act('stats'), 'ghost after'),
           // the saved list is managed here while the projector shows it
           s.list && h('div', { className: 'yes after' }, s.list.map(it => h('div', { className: 'row' },
             h('span', { className: it.done ? 'done' : '' }, it.text),
             h('button', { type: 'button', ariaLabel: it.done ? 'Oznacz jako niezrobione' : 'Oznacz jako zrobione', ariaPressed: it.done, onclick: () => act('yesdone', '', it.text) }, '✓'),
             h('button', { type: 'button', ariaLabel: 'Usuń z listy', onclick: () => confirm(`Usunąć „${it.text}” z listy?`) && act('yesdel', '', it.text) }, '✕'))))]
        : [h('p', { className: 'dim' }, 'Czekamy na drugą osobę…'),
           !other && btn('Zagraj z botem (test w pojedynkę)', () => act('bot'), 'ghost')],
      // trying things out alone: the bot partner can go, and a couple of bots can join for the ranking
      menu && other.bot && h('div', { className: 'row after' },
        btn('Usuń bota', () => act('bot'), 'ghost'),
        btn(s.pairs.some(x => x.players.every(o => o.bot)) ? 'Usuń parę botów' : 'Dodaj parę botów', () => act('botpair'), 'ghost')),
      btn('Zmień imię lub kolor', () => { editing = true; lastKey = ''; show(last); }, 'ghost after'),
    ];
  } else if (s.phase === 'question') {
    const mine = s.myAnswer, about = subj(s), k = s.q.kind;
    if (draftRound !== s.round) { draft = 50; draftRound = s.round; }
    // drawing needs the whole phone screen: just the word, the clock and the pad
    kids = k === 'draw' && s.me === s.subject ? [
      h('div', { className: 'row' }, h('h2', {}, s.q.text), clock(s)),
      pad(s),
      h('div', { className: 'row' }, btn('Cofnij kreskę', undoPad, 'ghost'), btn('Wyczyść', clearPad, 'ghost')),
    ] : [
      h('p', { className: 'dim' }, `${cardMode(s) ? 'Karta' : 'Runda'} ${s.round} z ${s.rounds}`),
      s.q.text && h('h2', {}, s.q.text),
      h('p', { className: 'dim' },
        k === 'draw' ? `Co rysuje ${about.name}? Patrz na ekran i zgaduj`
        : k === 'pick' ? (s.me === s.subject ? 'Twój wybór' : `${about.name} wybiera…`)
        : k === 'talk' ? s.q.options[0] + ' · bez punktów, po prostu porozmawiajcie'
        : k === 'text' ? 'Wpisz pierwsze skojarzenie — jedno słowo'
        : k === 'yesno' ? 'Tajne: ekran pokaże tylko wspólne TAK'
        : k === 'dare' ? (s.me === s.subject ? `${s.q.options[0]} dla Ciebie!` : `${s.q.options[0]} dla: ${about.name}. Oceń, gdy skończy`)
        : k === 'write' ? (s.me === s.subject ? 'Napisz o sobie dwie prawdy i jedno kłamstwo. Zaznacz kłamstwo.' : `${about.name} pisze dwie prawdy i jedno kłamstwo…`)
        : s.mode === 'blef' ? (s.me === s.subject ? 'Zaznaczone zdanie to Twoje kłamstwo' : `Które zdanie to kłamstwo?`)
        : !about ? 'Wybierz w tajemnicy' : s.me === s.subject ? 'Odpowiedz o sobie' : `Zgadnij, co odpowie ${about.name}`),
      k === 'talk'
        ? btn(s.round === s.rounds ? 'Zakończ rozmowę' : 'Dalej', () => act('next'))
        : k === 'pick'
        ? s.me === s.subject && s.q.options.map((text, i) => h('button', { className: 'btn pick', type: 'button', onclick: () => act('answer', '', String(i)) }, text))
        : k === 'dare'
        ? s.me !== s.subject && [btn('Zaliczone ✓', () => act('answer', '', '0')), btn('Odpuszczone ✗', () => act('answer', '', '1'), 'ghost')]
        : k === 'write'
        ? s.me === s.subject && h('form', { className: 'stack', onsubmit: e => {
            e.preventDefault();
            const f = new FormData(e.target);
            act('answer', f.get('lie'), f.getAll('st').join('\n'));
          } },
            [0, 1, 2].map(i => h('div', { className: 'stmt' },
              h('input', { name: 'st', maxLength: 80, required: true, autocomplete: 'off', placeholder: `Zdanie ${i + 1}`, ariaLabel: `Zdanie ${i + 1}` }),
              h('label', {}, h('input', { type: 'radio', name: 'lie', value: i, required: true }), 'kłamstwo'))),
            h('button', { className: 'btn' }, 'Gotowe'))
        : k === 'text' || k === 'draw'
        ? (mine != null
            ? h('div', { className: 'badge' }, s.myText)
            : h('form', { className: 'stack', onsubmit: e => {
                e.preventDefault();
                const word = $('word').value;
                $('word').value = ''; // cleared at once, so the next guess in "rysowanie" can be typed right away
                act('answer', '', word);
              } },
                k === 'draw' && clock(s),
                h('input', { id: 'word', maxLength: 30, required: true, autocapitalize: 'off', autocomplete: 'off', enterKeyHint: 'send', ariaLabel: 'Twoje skojarzenie' }),
                h('button', { className: 'btn' }, 'Wyślij')))
        : k === 'scale'
        ? (mine != null
            ? h('div', { className: 'big' }, String(mine))
            : [h('div', { className: 'big', id: 'val' }, String(draft)),
               h('input', { type: 'range', min: 0, max: 100, value: draft, ariaLabel: s.q.text,
                 oninput: e => { draft = +e.target.value; $('val').textContent = draft; } }),
               h('div', { className: 'ends' }, h('span', {}, s.q.options[0]), h('span', {}, s.q.options[1])),
               btn('Zatwierdź', () => act('answer', '', String(draft)))])
        : s.q.options.map((text, i) => h('button', {
            className: 'btn pick' + (s.q.options.length > 2 ? ' small' : ''), type: 'button',
            ariaPressed: mine === i, onclick: () => act('answer', '', String(i)),
          }, text)),
      h('p', { className: 'dim', id: 'status' }, waiting),
      k === 'draw' ? btn('Poddaję się — pokaż hasło', () => act('giveup'), 'ghost') : skip,
      quit,
    ];
  } else if (s.phase === 'reveal') {
    kids = [
      h('h2', {}, verdict(s).text),
      h('p', { className: 'dim' }, 'Spójrzcie na ekran'),
      btn(s.round === s.rounds ? 'Zobacz wynik' : 'Dalej', () => act('next')),
      quit,
    ];
  } else {
    kids = [summary(s), btn('Menu', () => act('quit'))];
  }
  $('app').replaceChildren(...kids.flat(3).filter(Boolean));
}

let rejoined = false;
live('/events?id=' + me.id, s => {
  // Server restarted or we were replaced: get our seat back with the saved profile.
  if (s.me < 0 && me.name && !rejoined) { rejoined = true; join(); }
  if (s.me >= 0) rejoined = false;
  show(s);
});
</script>
</body>
</html>
