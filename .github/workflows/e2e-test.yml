name: E2E Verification
run-name: >-
  ${{
      github.event_name == 'pull_request'
      && format('E2E Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
      ||
      github.event_name == 'push'
      && format('E2E Verification for CI: Merge -> {0}', github.event.head_commit.message)
  }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Chromium and WebKit (Safari on the iPhones) run side by side; the Chromium job keeps the name the ruleset requires
  e2e-ci-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Playwright Game Run
            browser: chromium
          - name: Playwright Game Run (WebKit)
            browser: webkit

    steps:
      - name: 📥 Git -- Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📘 Go -- Set up
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: 📘 Node -- Set up
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 📦 Go -- Build server
        run: go build -o bin/duet ./cmd/duet

      - name: 📦 Playwright -- Install with ${{ matrix.browser }}
        working-directory: e2e
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm ci --no-fund --no-audit && npx playwright install --with-deps "$BROWSER"

      - name: 🧪 Playwright -- Test Every Game Mode -> Projector and Two Phones
        env:
          BROWSER: ${{ matrix.browser }}
          FAIL_DIR: ${{ runner.temp }}/e2e-failure
        run: |
          mkdir -p "$FAIL_DIR"
          echo "⚙️ Playing every game mode in $BROWSER:"
          if ./e2e/run.sh; then
              echo ""
              echo "✅ All game modes played through in $BROWSER without browser errors."
          else
              echo ""
              echo "❌ Browser test in $BROWSER failed. Please fix the errors above."
              exit 1
          fi

      - name: 📤 Playwright -- Upload screens of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ matrix.browser }}
          path: ${{ runner.temp }}/e2e-failure
          retention-days: 7
