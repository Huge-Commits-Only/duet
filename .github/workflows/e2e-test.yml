name: E2E Verification
run-name: >-
  ${{
      github.event_name == 'pull_request'
      && format('E2E Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
      ||
      github.event_name == 'push'
      && format('E2E Verification for CI: Merge -> {0}', github.event.head_commit.message)
  }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-ci-test:
    name: Playwright Game Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Git -- Checkout repository
        uses: actions/checkout@v7

      - name: 📘 Go -- Set up
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: 📘 Node -- Set up
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: 📦 Go -- Build server
        run: go build -o bin/duet ./cmd/duet

      - name: 📦 Playwright -- Install with Chromium
        working-directory: e2e
        run: npm ci --no-fund --no-audit && npx playwright install --with-deps chromium

      - name: 🧪 Playwright -- Test Every Game Mode -> Projector and Two Phones
        run: |
          echo "⚙️ Playing every game mode in a real browser:"
          if ./e2e/run.sh; then
              echo ""
              echo "✅ All game modes played through without browser errors."
          else
              echo ""
              echo "❌ Browser test failed. Please fix the errors above."
              exit 1
          fi
