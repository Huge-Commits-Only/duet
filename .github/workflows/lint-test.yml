name: Lint Verification
run-name: >-
  ${{
      github.event_name == 'pull_request'
      && format('Lint Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
      ||
      github.event_name == 'push'
      && format('Lint Verification for CI: Merge -> {0}', github.event.head_commit.message)
  }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  lint-ci-test:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Git -- Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📘 Go -- Set up
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: 🧪 Go -- Test Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
