name: CodeQL Verification
run-name: >-
  ${{
      github.event_name == 'pull_request'
      && format('CodeQL Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
      ||
      github.event_name == 'push'
      && format('CodeQL Verification for CI: Merge -> {0}', github.event.head_commit.message)
      ||
      'CodeQL Verification: Weekly scan'
  }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]
  schedule:
    # Tuesday 05:00 UTC: new CodeQL queries also run on code that has not changed.
    - cron: "0 5 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: 📥 Git -- Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📘 Go -- Set up
        if: matrix.language == 'go'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: 🔎 CodeQL -- Initialize
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: 🧪 CodeQL -- Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
