name: Dependabot Auto-Merge
run-name: "Dependabot Auto-Merge: PR #${{ github.event.number }} -> ${{ github.event.pull_request.title }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable Auto-Merge
    # Only Dependabot's own PRs; forks never get a write token on pull_request anyway.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 🔎 Dependabot -- Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Patch and minor updates merge by themselves once every required check passes (ruleset on main).
      # Major updates wait for a person.
      - name: 🤖 GitHub -- Enable auto-merge
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
          echo "✅ Auto-merge enabled (${UPDATE}); waiting for required checks."
