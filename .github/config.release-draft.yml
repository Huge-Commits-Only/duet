name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Nowe funkcje"
    when:
      labels:
        - "feature"
        - "enhancement"

  - title: "🐛 Naprawione błędy"
    when:
      labels:
        - "fix"
        - "bugfix"
        - "bug"

  - title: "🔒 Bezpieczeństwo"
    when:
      labels:
        - "security"

  - title: "📦 Zależności"
    when:
      labels:
        - "dependencies"

  - title: "📝 Dokumentacja"
    when:
      labels:
        - "documentation"

  - title: "🧰 CI i utrzymanie"
    when:
      labels:
        - "chore"

  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "release-major"

  - type: "version-resolver"
    semver-increment: "minor"
    when:
      label: "release-minor"

  - type: "version-resolver"
    semver-increment: "patch"
    when:
      label: "release-patch"

  - type: "version-resolver"
    semver-increment: "minor"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

template: |
  ## 📋 Co się zmieniło

  $CHANGES
