name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Nowe funkcje"
    when:
      labels:
        - "feature"
        - "enhancement"

  - title: "Poprawki"
    when:
      labels:
        - "fix"
        - "bugfix"
        - "bug"

  - title: "Porządki"
    when:
      labels:
        - "chore"
        - "documentation"
        - "dependencies"

  - type: "version-resolver"
    semver-increment: "major"
    when:
      label: "release-major"

  - type: "version-resolver"
    semver-increment: "minor"
    when:
      label: "release-minor"

  - type: "version-resolver"
    semver-increment: "patch"
    when:
      label: "release-patch"

  - type: "version-resolver"
    semver-increment: "minor"

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

template: |
  ## Zmiany

  $CHANGES
