services:
  duet:
    image: ghcr.io/huge-commits-only/duet:latest
    build: .
    container_name: duet
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # zadane pytania, wspólna lista, własne paczki w /data/questions/*.json
      - duet-data:/data
    # Tylko gdy kod QR pokazuje zły adres:
    # environment:
    #   PUBLIC_URL: "https://duet.twoja-domena.duckdns.org"

volumes:
  duet-data:
