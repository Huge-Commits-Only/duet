services:
  duet:
    # DUET_VERSION=1.4.2 docker compose up -d   pins a release (and goes back to one); default: the newest
    image: ghcr.io/huge-commits-only/duet:${DUET_VERSION:-latest}
    build: .
    container_name: duet
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # zadane pytania, wspólna lista, własne paczki w /data/questions/*.json
      - duet-data:/data
    # Tylko gdy kod QR pokazuje zły adres:
    # environment:
    #   PUBLIC_URL: "https://duet.twoja-domena.duckdns.org"

volumes:
  duet-data:
